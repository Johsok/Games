<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#3a3a3a">
    <title>跳棋大師 2026</title>
    <link rel="manifest" id="manifest-placeholder">
    <style>
        /* === 核心變數與配色定義 === */
        :root {
            --bg-grad: radial-gradient(circle at center, #3a3a3a, #1a1a1a);
            --board-bg: #e0c38c;
            --hole-bg: rgba(0,0,0,0.2);
            --line-color: rgba(93, 64, 55, 0.3);
            --piece-shadow: 1px 3px 5px rgba(0,0,0,0.6), inset -2px -4px 6px rgba(0,0,0,0.3);
            
            /* 統一邊框寬度，避免切換風格時跳動 */
            --border-width: 12px;
            --border-style: solid; 
            --border-color: #5d4037;
            
            --safe-top: env(safe-area-inset-top, 0px); 
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            
            --p1-color: radial-gradient(circle at 30% 30%, #ff4d4d, #990000); /* 預設紅 */
            --p6-color: radial-gradient(circle at 30% 30%, #444444, #000000); /* 預設黑 */
            
            --hint-color: rgba(0, 255, 255, 0.6);
            --anim-speed: 0.6s;
        }

        /* === 視覺風格定義 === */
        body.t-classic { --bg-grad: radial-gradient(circle, #3e2723 0%, #1a0f0d 100%); --board-bg: #deb887; --line-color: rgba(93, 64, 55, 0.4); --border-color: #6d4c41; }
        body.t-ink { --bg-grad: linear-gradient(to bottom, #cfd9df 0%, #e2ebf0 100%); --board-bg: #f5f5f5; --hole-bg: rgba(0,0,0,0.1); --line-color: rgba(66, 66, 66, 0.2); --border-color: #424242; }
        body.t-jade { --bg-grad: radial-gradient(circle, #004d40, #00251a); --board-bg: #80cbc4; --hole-bg: rgba(0,77,64,0.3); --line-color: rgba(0, 77, 64, 0.3); --border-color: #00695c; }
        body.t-wood { --bg-grad: linear-gradient(135deg, #4e342e, #1b100d); --board-bg: #8d6e63; --hole-bg: rgba(62, 39, 35, 0.4); --line-color: rgba(62, 39, 35, 0.4); --border-color: #4e342e; }
        body.t-gold { --bg-grad: radial-gradient(circle, #2b2b2b, #000); --board-bg: #111; --hole-bg: #333; --line-color: rgba(255, 215, 0, 0.3); --border-color: #ffd700; }
        body.t-ocean { --bg-grad: linear-gradient(to bottom, #0d47a1, #000051); --board-bg: #1976d2; --hole-bg: rgba(0,0,81,0.3); --line-color: rgba(187, 222, 251, 0.3); --border-color: #90caf9; }
        body.t-royal { --bg-grad: linear-gradient(135deg, #4a148c, #1a0033); --board-bg: #7b1fa2; --hole-bg: rgba(74, 0, 114, 0.3); --line-color: rgba(225, 190, 231, 0.3); --border-color: #4a0072; }
        body.t-beast { --bg-grad: radial-gradient(circle, #d35400, #2c3e50); --board-bg: #e67e22; --hole-bg: rgba(94, 49, 5, 0.4); --line-color: rgba(94, 49, 5, 0.3); --border-color: #8e44ad; }
        body.t-playful { --bg-grad: linear-gradient(120deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); --board-bg: #fff0f5; --hole-bg: rgba(255, 105, 180, 0.2); --line-color: rgba(255, 105, 180, 0.3); --border-color: #ff69b4; }
        body.t-shan { --bg-grad: linear-gradient(to top, #cfd9df 0%, #e2ebf0 100%); --board-bg: #d7e4e8; --hole-bg: rgba(93, 109, 126, 0.3); --line-color: rgba(93, 109, 126, 0.3); --border-color: #5d6d7e; }
        body.t-cute { --bg-grad: linear-gradient(to right, #a1c4fd 0%, #c2e9fb 100%); --board-bg: #e0f7fa; --hole-bg: rgba(77, 208, 225, 0.3); --line-color: rgba(77, 208, 225, 0.4); --border-color: #b39ddb; }
        body.t-cyber { --bg-grad: repeating-linear-gradient(90deg, #111 0px, #111 2px, #000 2px, #000 40px); --board-bg: #050505; --hole-bg: #1a1a1a; --line-color: rgba(0, 255, 255, 0.3); --border-color: #0ff; }
        body.t-sketch { --bg-grad: #fff; --board-bg: #fff; --hole-bg: #eee; --line-color: rgba(34, 34, 34, 0.1); --border-color: #222; }
        body.t-dark { --bg-grad: linear-gradient(135deg, #232526, #414345); --board-bg: #333; --hole-bg: #111; --line-color: rgba(119, 119, 119, 0.3); --border-color: #555; }

        html, body { min-height: 100vh; width: 100%; overflow: auto; overscroll-behavior: none; }
        
        body { 
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; 
            background: var(--bg-grad); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            color: white; 
            transition: background 0.5s; 
            touch-action: auto; 
            box-sizing: border-box; 
        }

        /* --- CSS頂部極光進度條 --- */
        #scroll-progress-bar {
            position: fixed; 
            top: 0; left: 0; width: 0%; height: 4px; 
            background: linear-gradient(90deg, #00f260, #0575e6); 
            z-index: 99999; transition: width 0.15s ease-out; 
            box-shadow: 0 0 15px rgba(5, 117, 230, 0.7); 
            pointer-events: none; 
        }

        /* === 頂部 UI 樣式 === */
        header { 
            position: sticky; top: 0; left: 0;
            width: 100%; height: auto; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; gap: 4px; flex-shrink: 0; 
            z-index: 100; padding: calc(var(--safe-top) + 8px) 0 8px 0; 
            background: rgba(0,0,0,0.3); backdrop-filter: blur(8px); 
            border-bottom: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
            transition: all 0.3s ease;
        }

        .header-top { display: flex; align-items: center; justify-content: center; gap: 15px; width: 95%; max-width: 600px; flex-wrap: wrap;}
        h2 { font-size: 1.1rem; margin: 0; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); white-space: nowrap; font-weight: 700; }
        
        .status { color: #f1c40f; font-weight: bold; font-size: 0.85rem; text-shadow: 0 1px 3px rgba(0,0,0,0.9); line-height: 1.4; display: flex; align-items: center; gap: 15px; justify-content: center; width: auto; flex-direction: row;}
        
        .turn-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(255,255,255,0.5); vertical-align: middle; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .player-info { display: flex; align-items: center; gap: 4px; font-size: 0.8rem; color: #ddd; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 10px; }

        .btn-group { display: flex; gap: 8px; align-items: center; margin-top: 5px;}
        .btn { 
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
            color: #f0f0f0; padding: 5px 12px; border-radius: 20px; 
            cursor: pointer; font-size: 0.85rem; transition: all 0.2s; 
            white-space: nowrap; backdrop-filter: blur(4px); 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
            min-width: 80px; text-align: center;
        }
        .btn:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }
        .btn-red { background: rgba(220, 50, 50, 0.85); border: none; }
        .btn-undo { background: rgba(230, 140, 20, 0.85); border: none; }
        .btn-zoom { background: rgba(50, 150, 255, 0.85); border: none; padding: 5px 15px; font-weight: bold; font-size: 1rem; min-width: auto; }
        
        .mobile-only { display: none !important; } 

        @media (max-width: 1000px), (hover: none) and (pointer: coarse) {
            .mobile-only { display: inline-block !important; }
        }

        /* === 橫向模式 UI 適配 === */
        body.is-landscape { flex-direction: row; padding-left: var(--safe-left); padding-right: var(--safe-right); justify-content: center; }
        body.is-landscape header { width: 160px; height: 100vh; padding: 0; border-bottom: none; border-right: 1px solid rgba(255,255,255,0.1); justify-content: center; flex-direction: column; gap: 20px; background: rgba(0,0,0,0.4); }
        body.is-landscape .header-top { flex-direction: column; width: 100%; gap: 10px; margin: 0; }
        body.is-landscape h2 { white-space: normal; text-align: center; }
        body.is-landscape .status { font-size: 0.9rem; margin-bottom: 10px; text-align: center; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 10px;}
        body.is-landscape .btn-group { flex-direction: column; width: 100%; gap: 15px; }
        body.is-landscape .btn { width: 85%; text-align: center; padding: 10px 0; }

        /* === 設定面板樣式 === */
        #settings { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2000; background: rgba(30, 30, 30, 0.95); width: 340px; padding: 20px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.1); max-height: 90vh; overflow-y: auto; }
        .set-row { margin-bottom: 12px; }
        .flex-split { display: flex; gap: 10px; justify-content: space-between; }
        .flex-split > div { flex: 1 1 0; display: flex; flex-direction: column; width: 0; }
        .vol-row > div { padding: 0 10px; } 
        label { font-size: 0.85rem; margin-bottom: 5px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .vol-hint { color: #f1c40f; font-weight: bold; margin-left: 4px; }
        select, input[type=range] { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #555; background: #222; color: #fff; height: 38px; box-sizing: border-box; }
        input[type=checkbox] { width: 20px; height: 20px; vertical-align: middle; }

        /* === 遊戲容器與棋盤 === */
        #game-container { flex-shrink: 1; flex-grow: 1; display: flex; justify-content: center; align-items: center; overflow: auto; position: relative; width: 100%; box-sizing: border-box; touch-action: none; }
        body.is-landscape #game-container { width: auto; height: 100vh; flex-grow: 0; }
        
        .board-wrap { 
            position: relative; 
            background: var(--board-bg);
            border: 6px solid var(--border-color);
            border-radius: 50%; 
            aspect-ratio: 1 / 1; 
            width: var(--board-size); 
            height: var(--board-size);
            min-width: var(--board-size); 
            min-height: var(--board-size);
            max-width: var(--board-size); 
            max-height: var(--board-size);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4), inset 0 0 0 4px var(--board-bg), inset 0 0 0 6px var(--border-color);
            box-sizing: border-box; 
            flex-shrink: 0; 
            transition: background 0.3s ease, border 0.3s ease, box-shadow 0.3s ease; 
            background-clip: padding-box;
            margin: auto; 
        }

        .board-inner { position: relative; width: 100%; height: 100%; }
        svg.board-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        circle.hole { fill: var(--hole-bg); transition: fill 0.2s, stroke 0.3s; } 
        line.grid-line { stroke: var(--line-color); stroke-width: 2.5px; stroke-linecap: round; }
        
        .piece { 
            position: absolute; margin: 0; 
            width: 5.4%; height: 5.4%; 
            transform: translate(-50%, -50%) scale(0.85); border-radius: 50%; 
            box-shadow: var(--piece-shadow); cursor: pointer; z-index: 10; 
            transition: top var(--anim-speed) cubic-bezier(0.25, 1, 0.5, 1), left var(--anim-speed) cubic-bezier(0.25, 1, 0.5, 1), transform 0.1s; 
        }
        .piece.no-anim { transition: none !important; }
        .piece.selected { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 10px #fff; z-index: 100; }
        
        .piece.ghost { 
            opacity: 0.5; pointer-events: none; z-index: 5; box-shadow: none; 
            filter: grayscale(40%); border: 2px dashed rgba(255, 255, 255, 0.6);
            transform: translate(-50%, -50%) scale(0.8);
        }
        
        .piece.last-move::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 30%; height: 30%; background: #00e5ff; border-radius: 50%; box-shadow: 0 0 4px #000;
        }

        .piece.p1 { background: var(--p1-color); }
        .piece.p6 { background: var(--p6-color); }
        .piece.p2 { background: var(--p2-color); }
        .piece.p3 { background: var(--p3-color); }
        .piece.p4 { background: var(--p4-color); }
        .piece.p5 { background: var(--p5-color); }

        .hint {
            position: absolute; width: 5.4%; height: 5.4%; 
            transform: translate(-50%, -50%); border-radius: 50%;
            background: var(--hint-color); z-index: 5; cursor: pointer;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.8; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0; } }

        /* === 修正1：獲勝宣告樣式 (棋盤80%大，完美支援 RWD) === */
        #win-overlay { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            pointer-events: none; opacity: 0; z-index: 1000; white-space: nowrap; 
            /* 利用 vmin 單位，確保在所有裝置上都能完美滿版 (約佔據盤面 80%) */
            font: 900 12vmin "Microsoft JhengHei", sans-serif; 
            letter-spacing: 1vmin; color: #fff; -webkit-text-stroke: 0.5vmin #fff; 
            text-shadow: 0 0 2vmin #0ff, 0 0 4vmin #0ff, 0 0 8vmin #0ff; 
        }
        #win-overlay.show { opacity: 1; animation: win 2.5s ease-in-out infinite, hue 4s linear infinite; }
        @keyframes win { 
            0% { transform: translate(-50%,-50%) scale(0.5); opacity: 0; } 
            20%, 100% { transform: translate(-50%,-50%) rotate(-3deg); opacity: 1; } 
            60% { transform: translate(-50%,-52%) rotate(3deg); } 
        }
        @keyframes hue { to { filter: hue-rotate(360deg); } }

        #rules-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; justify-content: center; align-items: center; }
        .rules-content { background: #2b2b2b; width: 90%; max-width: 500px; border-radius: 12px; padding: 25px; color: #ddd; }
        .rules-content h3 { color: #f1c40f; text-align: center; border-bottom: 1px solid #555; padding-bottom: 10px;}
        .close-rules { width: 100%; padding: 10px; background: #cc0000; color: #fff; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer; font-weight: bold;}
    </style>
</head>
<body class="t-classic">

<div id="scroll-progress-bar"></div>

<header id="main-header">
    <div class="header-top">
        <h2 id="app-title">跳棋大師 2026</h2>
        <div class="status">
            <div id="player-indicator" style="display:none; justify-content:center; gap:10px;"></div>
            <div id="msg"><span class="turn-dot" style="background:red"></span> 紅方走棋</div>
        </div>
    </div>
    <div class="btn-group">
        <button class="btn" id="btn-settings" onclick="toggleSet()">⚙️ 設定</button>
        <button class="btn btn-undo" id="btn-undo" onclick="undo()">↩️ 悔棋</button>
        <button class="btn btn-red" id="btn-restart" onclick="restart()">🔄 重開</button>
        
        <button class="btn mobile-only btn-zoom" onclick="zoomBoard(1)">➕</button>
        <button class="btn mobile-only btn-zoom" onclick="zoomBoard(-1)">➖</button>
    </div>
</header>

<div id="settings">
    <div class="set-row flex-split">
        <div>
            <label id="lbl-mode">對戰模式</label>
            <select id="mode-sel" onchange="changeMode()">
                <option value="1" selected>👤 單人 (vs AI)</option>
                <option value="2">👥 雙人 (1v1)</option>
                <option value="3">👪 三人 (混戰)</option>
            </select>
        </div>
        <div>
            <label id="lbl-theme">視覺風格</label>
            <select id="theme-sel" onchange="changeTheme()">
                <option value="t-classic">💎 經典</option>
                <option value="t-ink">🏔️ 水墨</option>
                <option value="t-jade">📿 翡翠</option>
                <option value="t-wood">🪵 紅木</option>
                <option value="t-gold">👑 黑金</option>
                <option value="t-ocean">🌊 深海</option>
                <option value="t-royal">🏛️ 紫禁</option>
                <option value="t-beast">🦁 野獸</option>
                <option value="t-playful">🎈 俏皮</option>
                <option value="t-shan">🖌️ 山水</option>
                <option value="t-cute">🍬 可愛</option>
                <option value="t-cyber">🤖 賽博</option>
                <option value="t-sketch">✏️ 素描</option>
                <option value="t-dark">🌃 暗黑</option>
            </select>
        </div>
    </div>

    <div class="set-row flex-split">
        <div>
            <label id="lbl-diff">電腦難度</label>
            <select id="diff-sel">
                <option value="easy">簡單 (2s)</option>
                <option value="medium" selected>中等 (4s)</option>
                <option value="hard">困難 (8s)</option>
            </select>
        </div>
        <div id="side-select-container">
            <label id="lbl-side">先後手設定</label>
            <select id="side-sel" onchange="restart()">
                <option value="1" selected>🔴 我方先手</option>
                <option value="-1">⚫ 電腦先手</option>
            </select>
        </div>
    </div>

    <div class="set-row flex-split">
        <div>
            <label id="lbl-music">背景音樂</label>
            <select id="music-sel" onchange="changeMusic()">
                <option value="none">🔇 靜音</option>
                <option value="01">🎵 樂曲 01</option>
                <option value="02">🎵 樂曲 02</option>
                <option value="03" selected>🎵 樂曲 03</option>
                <option value="04">🎵 樂曲 04</option>
                <option value="05">🎵 樂曲 05</option>
                <option value="06">🎵 樂曲 06</option>
                <option value="07">🎵 樂曲 07</option>
            </select>
        </div>
        <div>
            <label id="lbl-lang">語言</label>
            <select id="lang-sel" onchange="changeLang()">
                <option value="tw" selected>繁中</option>
                <option value="cn">简中</option>
                <option value="en">English</option>
            </select>
        </div>
    </div>

    <div class="set-row flex-split vol-row">
        <div>
            <label id="lbl-vol-bgm">音樂音量<span id="bgm-val-hint" class="vol-hint">20</span></label>
            <input type="range" id="bgm-vol" min="0" max="100" value="20" oninput="adjBgm()">
        </div>
        <div>
            <label id="lbl-vol-sfx">音效音量<span id="sfx-val-hint" class="vol-hint">50</span></label>
            <input type="range" id="sfx-vol" min="0" max="100" value="50" oninput="adjSfx()">
        </div>
    </div>
    
    <div class="set-row flex-split" style="margin-top:12px; align-items: flex-end;">
        <div style="flex: 1;">
            <label id="lbl-color">玩家棋色</label>
            <select id="color-sel" onchange="updatePlayerColor()">
            </select>
        </div>
        <div style="flex: 1;"></div>
    </div>
    
    <div class="set-row flex-split" style="margin-top:10px; align-items: flex-end;">
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 5px;">
            <label style="cursor:pointer; display:flex; align-items:center;">
                <input type="checkbox" id="hint-toggle" checked onchange="toggleHints()">
                <span id="lbl-hint" style="margin-left:8px; color:#fff;">移動提示</span>
            </label>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 5px;">
            <label style="cursor:pointer; display:flex; align-items:center;">
                <input type="checkbox" id="aiprog-toggle" checked onchange="toggleAiProgress()">
                <span id="lbl-aiprog" style="margin-left:8px; color:#fff;">電腦思考進度</span>
            </label>
        </div>
    </div>
    
    <div class="set-row flex-split" style="margin-top:10px;">
        <div style="flex: 1;">
             <button class="btn" id="btn-rules" onclick="toggleRules()" style="width:100%; background:#2c3e50; padding: 10px; height: 38px;">📖 規則</button>
        </div>
        <div style="flex: 1;">
             <button class="btn" id="btn-home" onclick="goHome()" style="width:100%; background:#c0392b; padding: 10px; height: 38px;">🏠 回首頁</button>
        </div>
    </div>

    <button class="btn" id="btn-done" style="width:100%; background:#444; padding: 10px; margin-top:15px;" onclick="toggleSet()">完成設定</button>
    <div style="font-size: 10px; color: #888; text-align: center; margin-top: 15px;">© 2026 Johsok. All rights reserved.</div>
</div>

<div id="rules-modal">
    <div class="rules-content">
        <h3 id="rules-title">跳棋規則</h3>
        <ul id="rules-ul-basic" style="padding-left: 20px; line-height: 1.6;">
            <li><b>目標：</b>將己方所有棋子移動到正對面的三角區域。</li>
            <li><b>移動：</b>可移動到相鄰空位，或"跳過"相鄰的棋子（不分敵我）。</li>
            <li><b>連跳：</b>若跳過後仍有棋子可跳，可連續跳躍。</li>
            <li><b>獲勝：</b>最先將所有棋子佔滿目標區域者獲勝。</li>
        </ul>
        <button class="close-rules" id="btn-close-rules" onclick="toggleRules()">關閉說明</button>
    </div>
</div>

<div id="game-container">
    <div class="board-wrap" id="board-wrap">

const workerScript = `
let ADJ = {}, JUMP_ADJ = {}, coords = [];

/* ===============================
   建圖
=============================== */
function buildGraph(c) {
    coords = c;
    ADJ = {}; JUMP_ADJ = {};

    for (let i = 0; i < coords.length; i++) {
        ADJ[i] = []; JUMP_ADJ[i] = [];

        for (let j = 0; j < coords.length; j++) {
            if (i === j) continue;
            let d = Math.hypot(coords[i].x - coords[j].x, coords[i].y - coords[j].y);
            if (d < 1.2) ADJ[i].push(j);
        }
    }

    for (let i = 0; i < coords.length; i++) {
        for (let mid of ADJ[i]) {
            let c1 = coords[i], cm = coords[mid];
            let tx = cm.x + (cm.x - c1.x);
            let ty = cm.y + (cm.y - c1.y);

            for (let k = 0; k < coords.length; k++) {
                let ck = coords[k];
                if (Math.abs(ck.x - tx) < 0.1 && Math.abs(ck.y - ty) < 0.1) {
                    JUMP_ADJ[i].push({ mid, dest: k });
                    break;
                }
            }
        }
    }
}

/* ===============================
   取得走法（含跳躍次數計算）
=============================== */
function getMoves(board, player) {
    let moves = [];
    for (let i = 0; i < board.length; i++) {
        if (board[i] !== player) continue;
        let map = new Map();

        for (let n of ADJ[i]) {
            if (board[n] === 0) map.set(n, 0);
        }

        let queue = [{ pos: i, jumps: 0 }];
        let visited = new Map();
        visited.set(i, 0);

        while (queue.length) {
            let { pos, jumps } = queue.shift();
            for (let j of JUMP_ADJ[pos]) {
                if (board[j.mid] !== 0 && board[j.dest] === 0) {
                    let nj = jumps + 1;
                    if (!visited.has(j.dest) || visited.get(j.dest) < nj) {
                        visited.set(j.dest, nj);
                        queue.push({ pos: j.dest, jumps: nj });
                        map.set(j.dest, nj);
                    }
                }
            }
        }

        for (let [to, jump] of map) {
            moves.push({ from: i, to, jump });
        }
    }
    return moves;
}

function dist(i, target) {
    if (typeof target === 'number') {
        return Math.hypot(coords[i].x - coords[target].x, coords[i].y - coords[target].y);
    }
    return Math.hypot(coords[i].x - target.x, coords[i].y - target.y);
}

/* ===============================
   Heuristic 評估函數（引導 MCTS 走向）
=============================== */
function evaluate(board, player, target, targetIndices) {
    let myPieces = [];
    for (let i = 0; i < board.length; i++) {
        if (board[i] === player) myPieces.push(i);
    }

    let score = 0;
    let sumDist = 0;
    let maxDist = -Infinity;
    let startZoneCount = 0;

    for (let p of myPieces) {
        let d = dist(p, target);
        sumDist += d;

        if (d > maxDist && targetIndices && !targetIndices.includes(p)) {
            maxDist = d;
        }
        
        // 修正2：嚴格定義並加重原始區域的懲罰
        if (d > 65) startZoneCount++;

        if (targetIndices && targetIndices.includes(p)) {
            score += 100000; // 抵達終點給予破格獎勵
            score -= Math.pow(d, 2) * 100; // 擠向最深處，讓出大門
        } else {
            score -= d * 20; // 距離終點越近越好
            let center = Math.abs(coords[p].x - 50);
            score -= center * 1;
        }
    }

    score -= sumDist * 25;
    
    // 修正2：給予孤兒極度嚴重的扣分，強迫 AI 回頭拉拔最後面的棋子
    if (maxDist !== -Infinity) score -= Math.pow(maxDist, 2) * 5; 
    
    // 修正2：嚴重懲罰滯留原始區域，逼迫起步
    score -= startZoneCount * 5000; 

    let front = Math.min(...myPieces.map(p => dist(p, target)));
    score -= front * 80; // 獎勵前線突破

    let progress = 0;
    for (let p of myPieces) {
        progress += (100 - dist(p, target));
    }
    score += progress * 30;

    return score;
}

/* ===============================
   MCTS Node
=============================== */
class Node {
    constructor(board, parent, move, player) {
        this.board = board;
        this.parent = parent;
        this.move = move;
        this.player = player;

        this.children = [];
        this.visits = 0;
        this.score = 0;
        this.isExpanded = false;
    }
}

/* ===============================
   UCB1
=============================== */
function ucb1(node) {
    if (node.visits === 0) return Infinity;
    
    let exploitation = node.score / node.visits;
    let exploration = 20000 * Math.sqrt(Math.log(node.parent.visits) / node.visits); 
    
    // 修正2：如果是根節點的子節點，給予連跳強大的探索偏好，保證 AI 絕對優先考慮長連跳
    let jumpBonus = (node.parent && node.parent.parent === null && node.move) ? (node.move.jump * 5000) : 0;
    
    return exploitation + exploration + jumpBonus;
}

/* ===============================
   Selection
=============================== */
function select(node) {
    while (node.isExpanded && node.children.length > 0) {
        node = node.children.reduce((a, b) => ucb1(a) > ucb1(b) ? a : b);
    }
    return node;
}

/* ===============================
   Expansion
=============================== */
function expand(node, player) {
    let moves = getMoves(node.board, player);
    node.isExpanded = true;
    
    if (moves.length === 0) return node;

    // 修正2：嚴格防呆，絕對禁止純粹的無意義後退。除非是為了連跳搭橋，否則只允許前進
    moves = moves.filter(m => {
        let gain = dist(m.from, node.target) - dist(m.to, node.target);
        return gain > -1.0 || m.jump >= 2; 
    });

    if (moves.length === 0) moves = getMoves(node.board, player);

    for (let m of moves) {
        let next = [...node.board];
        next[m.to] = player;
        next[m.from] = 0;
        let child = new Node(next, node, m, player);
        child.target = node.target; 
        node.children.push(child);
    }

    return node.children[Math.floor(Math.random() * node.children.length)];
}

/* ===============================
   Simulation（模擬探索）
=============================== */
function simulate(board, player, target, targetIndices) {
    let current = [...board];

    for (let i = 0; i < 15; i++) { 
        let moves = getMoves(current, player);
        if (moves.length === 0) break;

        // 修正2：模擬時絕對優先選擇「跳躍次數多」、「前進距離遠」的走法
        moves.sort((a, b) => {
            if (b.jump !== a.jump) return b.jump - a.jump;
            let gainA = dist(a.from, target) - dist(a.to, target);
            let gainB = dist(b.from, target) - dist(b.to, target);
            return gainB - gainA;
        });

        // 縮小隨機池，保證模擬品質
        let pick = moves[Math.floor(Math.random() * Math.min(2, moves.length))];

        current[pick.to] = player;
        current[pick.from] = 0;
    }

    return evaluate(current, player, target, targetIndices);
}

/* ===============================
   Backpropagation
=============================== */
function backprop(node, score) {
    while (node) {
        node.visits++;
        node.score += score;
        node = node.parent;
    }
}

/* ===============================
   MCTS 主流程
=============================== */
function mcts(rootBoard, player, target, targetIndices, timeLimit) {
    let rootMoves = getMoves(rootBoard, player);
    if (rootMoves.length === 0) return null;

    // === 修正3：建立絕對安全的預設最佳解 (Fallback) ===
    // 若倒數計時結束導致 MCTS 樹尚未收斂，強制回傳此最佳解，確保 AI 不會亂走
    rootMoves.sort((a, b) => {
        if (b.jump !== a.jump) return b.jump - a.jump; // 跳最多步的最優先
        let gainA = dist(a.from, target) - dist(a.to, target);
        let gainB = dist(b.from, target) - dist(b.to, target);
        return gainB - gainA; // 前進最多的次優先
    });
    let fallbackMove = rootMoves[0];

    let root = new Node(rootBoard, null, null, player);
    root.target = target;
    
    let end = Date.now() + timeLimit - 100; // 保留緩衝防止超時

    // 蒙地卡羅大迴圈
    while (Date.now() < end) {
        let node = select(root);

        if (node.visits > 0 || node === root) {
            let expandedNode = expand(node, player);
            if(expandedNode) node = expandedNode;
        }

        let score = simulate(node.board, player, target, targetIndices);
        backprop(node, score);
    }

    if (root.children.length === 0) return fallbackMove;

    // 正常情況：選擇 MCTS 探勘最穩定的走法
    let best = root.children.reduce((a, b) => a.visits > b.visits ? a : b);
    let bestNodes = root.children.filter(c => c.visits === best.visits);
    if (bestNodes.length > 1) {
        best = bestNodes.reduce((a, b) => (a.score / a.visits) > (b.score / b.visits) ? a : b);
    }

    // 修正3：如果 MCTS 因為時間不夠而算出一個倒退的走法，無條件攔截，並回傳預設的貪婪最佳解
    let bestGain = dist(best.move.from, target) - dist(best.move.to, target);
    if (bestGain < 0 && fallbackMove.jump > 0) {
        return fallbackMove;
    }

    return best.move || fallbackMove;
}

/* ===============================
   Worker
=============================== */
self.onmessage = function(e) {
    const { type, data } = e.data;

        let move = mcts(board, player, target, targetIndices, timeLimit || 1000);

};

    const cx = 50, cy = 50;
    let x = cx + scale * (Math.sqrt(3) * q + Math.sqrt(3)/2 * r);
    let y = cy + scale * (1.5 * r);
    boardCoords.push({q, r, x, y, idx: boardCoords.length});
}

function initGame() {
    initColorSelect();
    initBoardGeometry();
    initWorker();
    
    adjList = new Array(boardCoords.length).fill(0).map(() => []);
    for(let i=0; i<boardCoords.length; i++) {
        for(let j=i+1; j<boardCoords.length; j++) {
            let c1 = boardCoords[i], c2 = boardCoords[j];
            let dist = Math.abs(c1.q - c2.q) + Math.abs(c1.r - c2.r) + Math.abs((-c1.q-c1.r) - (-c2.q-c2.r));
            if (dist === 2) { adjList[i].push(j); adjList[j].push(i); }
        }
    }
    
    drawBoard();
    restart();
    window.addEventListener('resize', resizeBoard);
    resizeBoard();
}

function initColorSelect() {
    const sel = document.getElementById('color-sel');
    const t = TRANSLATIONS[currentLang];
    sel.innerHTML = '';
    PIECE_COLORS.forEach((c, idx) => {
        let opt = document.createElement('option');
        opt.value = idx;
        opt.text = t.colors[idx];
        if(idx === 0) opt.selected = true; 
        sel.appendChild(opt);
    });
}

function initWorker() {
    const blob = new Blob([workerScript], {type: 'application/javascript'});
    worker = new Worker(URL.createObjectURL(blob));
    worker.postMessage({ type: 'init', data: { coords: boardCoords } });
    
    worker.onmessage = e => {
        const move = e.data;
        const delay = Math.max(0, targetAiTime - Date.now()); 

        aiMoveTimeout = setTimeout(() => {
            clearInterval(aiTimerInterval);
            isAiThinking = false; 
            document.getElementById('scroll-progress-bar').style.width = '0%'; 
            
            if (move && move.from !== undefined && move.to !== undefined) {
                 makeMove(move.from, move.to);
            } else {
                 forceRandomMove();
            }
        }, delay);
    };
}

function forceRandomMove() {
    let aiPlayer = players[currentPlayer];
    let myPieces = [];
    boardState.forEach((pid, idx) => { if(pid === aiPlayer.id) myPieces.push(idx); });
    let moves = [];
    myPieces.forEach(from => {
        let ms = calculateMoves(from);
        ms.forEach(to => moves.push({from, to}));
    });
    if(moves.length > 0) {
        let m = moves[Math.floor(Math.random()*moves.length)];
        makeMove(m.from, m.to);
    } else {
        currentPlayer = (currentPlayer + 1) % players.length;
        updateStatus();
    }
}

function resizeBoard() {
    const isLand = window.innerWidth > window.innerHeight && window.innerHeight < 650;
    isLand ? document.body.classList.add('is-landscape') : document.body.classList.remove('is-landscape');
    const wrap = document.getElementById('board-wrap');
    const header = document.getElementById('main-header');
    
    wrap.style.width = wrap.style.height = wrap.style.marginTop = '';
    header.style.marginRight = '0';
    
    const winW = window.innerWidth, winH = window.innerHeight;
    let finalSize;
    
    if (isLand) {
        header.style.marginRight = '20px';
        finalSize = Math.min(winW - 160 - 40, winH - 40); 
    } else {
        wrap.style.marginTop = '10px';
        finalSize = Math.min(winW - 40, winH - header.offsetHeight - 40);
    }
    
    baseBoardSize = Math.max(280, finalSize);
    applyZoom();
}

function drawBoard() {
    const svg = document.getElementById('board-svg');
    let html = '';
    for(let i=0; i<boardCoords.length; i++) {
        let p1 = boardCoords[i];
        for(let n of adjList[i]) {
            if(n < i) continue;
            let p2 = boardCoords[n];
            html += `<line x1="${p1.x}%" y1="${p1.y}%" x2="${p2.x}%" y2="${p2.y}%" class="grid-line" />`;
        }
    }
    for(let i=0; i<boardCoords.length; i++) {
        let p = boardCoords[i];
        html += `<circle id="hole-${i}" cx="${p.x}%" cy="${p.y}%" r="1.7%" class="hole" />`;
    }
    svg.innerHTML = html;
}

        } else if (mode === "3") {

            players.push({id: 3, type: 'human', name: "P2", startZone: 6, target: ZONES[6].target, colorName: "Blue"});

    players.forEach(p => {

                     : getComputedStyle(document.documentElement).getPropertyValue(`--p${p.id}-color`);

        boardCoords.forEach(c => {

                let holeEl = document.getElementById(`hole-${c.idx}`);
                if (holeEl) {

function restart() {
    setupPlayers();
    boardState = new Array(boardCoords.length).fill(0);
    historyStack = [];
    selectedPiece = -1;
    validMoves = [];
    isAnimating = false;
    lastMovedPiece = -1;
    isAiThinking = false;
    
    // 修正1：解鎖遊戲狀態
    gameEnded = false;
    
    clearInterval(aiTimerInterval);
    clearTimeout(aiMoveTimeout);
    
    document.getElementById('ghosts-layer').innerHTML = '';
    document.getElementById('win-overlay').classList.remove('show');
    document.getElementById('scroll-progress-bar').style.width = '0%'; 
    
    players.forEach(p => {
        let filterFunc = ZONES[p.startZone].filter;
        let startIndices = boardCoords.filter(filterFunc).map(c => c.idx);
        startIndices.forEach(idx => boardState[idx] = p.id);
    });
    
    currentPlayer = 0; 
    updateStatus();
    updateZoneHighlights(); 
    renderPieces();
    
    setTimeout(checkAiTurn, 500);
}

function renderPieces() {
    const layer = document.getElementById('pieces-layer');
    layer.innerHTML = '';
    
    if (players[currentPlayer].type === 'human') {
        isAiThinking = false;
    }

    boardState.forEach((pid, idx) => {
        if(pid === 0) return;
        const p = boardCoords[idx];
        const el = document.createElement('div');
        
        el.className = `piece p${pid} ${selectedPiece === idx ? 'selected' : ''} ${lastMovedPiece === idx ? 'last-move' : ''}`;
        el.style.left = `${p.x}%`;
        el.style.top = `${p.y}%`;
        el.dataset.idx = idx; 
        
        if (!animEnabled) el.classList.add('no-anim');
        
        if (players[currentPlayer].type === 'human' && players[currentPlayer].id === pid) {
            el.onclick = (e) => { e.stopPropagation(); selectPiece(idx); };
        }
        layer.appendChild(el);
    });
    
    const hintsLayer = document.getElementById('hints-layer');
    hintsLayer.innerHTML = '';
    
    validMoves.forEach(idx => {
        const p = boardCoords[idx];
        const el = document.createElement('div');
        el.className = 'hint';
        el.style.left = `${p.x}%`;
        el.style.top = `${p.y}%`;
        
        if (!hintsEnabled) {
            el.style.background = 'transparent';
            el.style.animation = 'none';
        }
        
        el.onclick = (e) => { e.stopPropagation(); makeMove(selectedPiece, idx); };
        hintsLayer.appendChild(el);
    });
}

function createGhost(idx, pid, className) {
    const layer = document.getElementById('ghosts-layer');
    const p = boardCoords[idx];
    const el = document.createElement('div');
    el.className = `piece p${pid} ghost ${className}`;
    el.style.left = `${p.x}%`;
    el.style.top = `${p.y}%`;
    layer.appendChild(el);
}

function calculateMoves(idx) {
    let moves = new Set();
    let startCoord = boardCoords[idx];
    
    adjList[idx].forEach(n => { if (boardState[n] === 0) moves.add(n); });

    let queue = [idx];
    let visited = new Set([idx]);
    
    while(queue.length > 0) {
        let curr = queue.shift();
        let currCoord = boardCoords[curr];
        
        adjList[curr].forEach(mid => {
            if (boardState[mid] !== 0) { 
                let mc = boardCoords[mid];
                let tx = mc.q + (mc.q - currCoord.q);
                let ty = mc.r + (mc.r - currCoord.r);
                let destIdx = boardCoords.findIndex(c => c.q === tx && c.r === ty);
                if (destIdx !== -1 && boardState[destIdx] === 0 && !visited.has(destIdx)) {
                    visited.add(destIdx);
                    queue.push(destIdx);
                    moves.add(destIdx);
                }
            }
        });
    }
    return Array.from(moves);
}

function selectPiece(idx) {
    // 修正1：遊戲結束時禁止操作
    if (gameEnded || isAnimating || isAiThinking) return;
    if (selectedPiece === idx) { selectedPiece = -1; validMoves = []; } 
    else { selectedPiece = idx; validMoves = calculateMoves(idx); playSfx(300); }
    renderPieces();
}

function makeMove(from, to) {
    const movingPlayer = players[currentPlayer];
    const fromCoord = boardCoords[from];
    const toCoord = boardCoords[to];
    
    if (movingPlayer.type === 'human') {
        document.querySelectorAll('.ghost.type-human').forEach(e => e.remove());
        createGhost(from, boardState[from], 'type-human');
    } else {
        document.querySelectorAll('.ghost.type-ai').forEach(e => e.remove());
        createGhost(from, boardState[from], 'type-ai');
    }
    
    if (animEnabled) {
        isAnimating = true;
        const pieceEl = document.querySelector(`.piece[data-idx="${from}"]`);
        if (pieceEl) {
            pieceEl.style.left = `${toCoord.x}%`;
            pieceEl.style.top = `${toCoord.y}%`;
            setTimeout(() => {
                finalizeMove(from, to);
                isAnimating = false;
                checkAiTurn();
            }, 600); 
        } else {
            finalizeMove(from, to);
            isAnimating = false;
            checkAiTurn();
        }
    } else {
        finalizeMove(from, to);
        checkAiTurn();
    }
}

function finalizeMove(from, to) {
    historyStack.push({ board: [...boardState], player: currentPlayer, lastMoved: lastMovedPiece });
    boardState[to] = boardState[from];
    boardState[from] = 0;
    selectedPiece = -1;
    validMoves = [];
    lastMovedPiece = to;
    
    playSfx(500);
    checkWin();
    
    // 如果遊戲已經結束，就不必再換位思考了
    if (!gameEnded) {
        currentPlayer = (currentPlayer + 1) % players.length;
        updateStatus();
    }
    renderPieces();
}

function checkWin() {
    let p = players[currentPlayer];
    let startZone = p.startZone;
    let targetZone = ZONES[startZone].opposite;
    
    let filterFunc = ZONES[targetZone].filter;
    let targetIndices = boardCoords.filter(filterFunc).map(c => c.idx);
    
    if (targetIndices.length > 0) {
        let count = 0;
        targetIndices.forEach(idx => { if (boardState[idx] === p.id) count++; });
        if (count === 10) {
            // 修正1：遊戲結束，啟動鎖定，阻止 AI 與玩家繼續走棋
            gameEnded = true; 
            playWinSfx();
            
            let winText = "";
            const mode = document.getElementById('mode-sel').value;

            if (mode === "1") {
                if (p.type === 'human') {
                    winText = "You Win !";
                } else {
                    winText = "You Lose !";
                }
            } else {
                let colorName = p.colorName || "Player";
                winText = `${colorName} Win !`;
            }

            document.getElementById('win-overlay').innerText = winText;
            document.getElementById('win-overlay').classList.add('show');
            isAiThinking = false; 
        }
    }
}

function checkAiTurn() {
    // 修正1：遊戲結束不再讓 AI 動作
    if (gameEnded) return;

    if (players[currentPlayer].type === 'ai') {
        isAiThinking = true;
        
        const diff = document.getElementById('diff-sel').value;
        const timeLimit = diff === 'easy' ? 2000 : (diff === 'medium' ? 4000 : 8000);
        
        let timeLeft = timeLimit;
        const t = TRANSLATIONS[currentLang];
        
        updateStatus(`${t.thinking} ${(timeLeft/1000).toFixed(1)}s`);
        
        if(aiTimerInterval) clearInterval(aiTimerInterval);
        
        aiTimerInterval = setInterval(() => {
            timeLeft -= 100;
            if (timeLeft < 0) timeLeft = 0;
            updateStatus(`${t.thinking} ${(timeLeft/1000).toFixed(1)}s`);
            
            if (aiProgEnabled) {
                const p = ((timeLimit - timeLeft) / timeLimit) * 100;
                document.getElementById('scroll-progress-bar').style.width = p + '%';
            }

            if (timeLeft <= 0) {
                clearInterval(aiTimerInterval);
            }
        }, 100);

        let p = players[currentPlayer];
        let tCoord = p.target;
        
        let targetPos = boardCoords.find(c => c.q === tCoord.q && c.r === tCoord.r);
        
        if (!targetPos) {
             targetPos = {x: 50, y: 50}; 
        }
        
        let startZoneId = p.startZone;
        let targetZoneId = ZONES[startZoneId].opposite;
        let filterFunc = ZONES[targetZoneId].filter;
        let targetIndices = boardCoords.filter(filterFunc).map(c => c.idx);
        
        targetAiTime = Date.now() + timeLimit; 
        
        worker.postMessage({
            type: 'think',
            data: { board: boardState, player: p.id, target: targetPos, targetIndices: targetIndices, timeLimit: timeLimit }
        });
    }
}

function undo() {
    if (isAiThinking || isAnimating || historyStack.length === 0) return;
    
    // 修正1：悔棋時解鎖遊戲
    gameEnded = false;

    let prev = historyStack.pop();
    if (document.getElementById('mode-sel').value === '1' && historyStack.length > 0) {
         prev = historyStack.pop(); 
    }
    boardState = prev.board;
    currentPlayer = prev.player;
    lastMovedPiece = prev.lastMoved || -1;
    selectedPiece = -1;
    validMoves = [];
    document.getElementById('ghosts-layer').innerHTML = '';
    document.getElementById('scroll-progress-bar').style.width = '0%'; 
    renderPieces();
    updateStatus();
    document.getElementById('win-overlay').classList.remove('show');
}

function getMp3Path(val) {
    if (val === 'none') return "";
    const baseUrl = "https://johsok.github.io/Games/MP3/";
    return `${baseUrl}${val}.mp3`;
}

function unlockAudio() {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    audio.volume = document.getElementById('bgm-vol').value/100;
    if ((!audio.src || audio.src === "") && document.getElementById('music-sel').value !== 'none') {
        audio.src = getMp3Path(document.getElementById('music-sel').value);
    }
    if(document.getElementById('music-sel').value !== 'none') audio.play().catch(() => {});
}

function playSfx(freq, type) { 
    if(audioCtx.state === 'suspended') audioCtx.resume(); 
    const v = document.getElementById('sfx-vol').value/100; if(v <= 0.01) return; 
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain(); 
    osc.connect(g); g.connect(audioCtx.destination); 
    if(type === 'win') {
        osc.type = "square"; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        g.gain.setValueAtTime(v, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
        osc.start(); osc.stop(audioCtx.currentTime+1);
    } else {
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq/2, audioCtx.currentTime + 0.1);
        g.gain.setValueAtTime(v, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime+0.15);
    }
}

function playWinSfx() { 
    if(audioCtx.state === 'suspended') audioCtx.resume(); 
    const v = document.getElementById('sfx-vol').value/100; if(v <= 0.01) return; 
    
    const notes = [523.25, 659.25, 783.99, 1046.50]; 
    const loops = 5; 
    const noteSpeed = 0.12; 
    const loopDuration = notes.length * noteSpeed;
    const gap = 0.05; 
    
    const now = audioCtx.currentTime; 

    for (let l = 0; l < loops; l++) {
        let startTimeBase = now + (l * (loopDuration + gap));
        
        for (let i = 0; i < notes.length; i++) { 
            const freq = notes[i]; 
            const osc = audioCtx.createOscillator(); 
            const g = audioCtx.createGain(); 
            osc.type = "square"; 
            osc.connect(g); 
            g.connect(audioCtx.destination); 
            const startTime = startTimeBase + i * noteSpeed; 
            osc.frequency.setValueAtTime(freq, startTime); 
            g.gain.setValueAtTime(0, startTime); 
            g.gain.linearRampToValueAtTime(v * 0.2, startTime + 0.05); 
            g.gain.exponentialRampToValueAtTime(0.001, startTime + noteSpeed); 
            osc.start(startTime); 
            osc.stop(startTime + noteSpeed); 
        }
    }
}

let initialPinchDistance = null;
let startZoom = 1.0;

const gameContainerEl = document.getElementById('game-container');

gameContainerEl.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
        isPanning = false;
        e.preventDefault(); 
        initialPinchDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        startZoom = currentZoom; 
    } else if (e.touches.length === 1) {
        isPanning = true;
        hasMoved = false; 
        lastPanX = e.touches[0].clientX;
        lastPanY = e.touches[0].clientY;
    }
}, { passive: false });

gameContainerEl.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && initialPinchDistance) {
        hasMoved = true;
        e.preventDefault(); 
        
        let currentDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        
        let scale = currentDistance / initialPinchDistance;
        currentZoom = startZoom * scale;
        
        if (currentZoom < 1.0) currentZoom = 1.0;
        if (currentZoom > 3.0) currentZoom = 3.0;
        
        applyZoom(); 
        
    } else if (e.touches.length === 1 && isPanning) {
        let currentX = e.touches[0].clientX;
        let currentY = e.touches[0].clientY;
        let moveX = currentX - lastPanX;
        let moveY = currentY - lastPanY;
        
        if (Math.abs(moveX) > 3 || Math.abs(moveY) > 3) {
            hasMoved = true;
            e.preventDefault(); 
            
            panX += moveX;
            panY += moveY;
            document.getElementById('board-wrap').style.transform = `translate3d(${panX}px, ${panY}px, 0)`;
            
            lastPanX = currentX;
            lastPanY = currentY;
        }
    }
}, { passive: false });

gameContainerEl.addEventListener('touchend', (e) => {
    if (!hasMoved && e.changedTouches.length === 1) {
        let target = e.target;
        if (target && (target.classList.contains('piece') || target.classList.contains('hint'))) {
            e.preventDefault(); 
            target.click();
        }
    }

    if (e.touches.length < 2) {
        initialPinchDistance = null;
    }
    if (e.touches.length === 0) {
        isPanning = false;
    }
});
