<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Johsok's Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* === 科技山水配色 === */
            --bg-deep: #05080a;     /* 深墨色背景 */
            --text-main: #dcdfe3;   /* 銀灰字體 */
            --jade-glow: #64ffda;   /* 青玉光 (科技主色) */
            --cyber-blue: #00b4d8;  /* 輔助科技藍 */
            --neon-purple: #bd34fe; /* 霓虹紫 */
            --glass-bg: rgba(20, 25, 30, 0.6); /* 毛玻璃背景 */
            --glass-border: rgba(100, 255, 218, 0.2);
            --chess-red: #ff4d4d;   /* 帥方紅 */
            --chess-black: #00e676; /* 將方綠 (科技黑) */
        }

        body {
            font-family: 'Noto Serif TC', "PingFang TC", serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }

        /* === 基礎動畫 === */
        @keyframes grid-drift {
            0% { background-position: 0 0; }
            100% { background-position: 0 50px; }
        }

        @keyframes scan-light {
            0% { background-position: -100% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes border-pulse {
            0%, 100% { border-color: rgba(100, 255, 218, 0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
            50% { border-color: rgba(100, 255, 218, 0.5); box-shadow: 0 10px 30px rgba(100, 255, 218, 0.1); }
        }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes text-glitch {
            0%, 100% { opacity: 1; }
            93% { opacity: 0.6; }
            97% { opacity: 0.4; }
        }

        /* === 1. 象棋動畫：互繞公轉 + 自轉抵消 === */
        @keyframes orbit-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes counter-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        @keyframes piece-pulse {
            0%, 100% { box-shadow: 0 0 10px rgba(0,0,0,0.5); }
            50% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.3); }
        }

        /* === 2. 五子棋動畫：旋轉 === */
        @keyframes gomoku-spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* 五子棋展開動畫 (Entry) */
        @keyframes stones-expand {
            0% { transform: translate(-50%, -50%); opacity: 0; }
            100% { opacity: 1; } /* 結束位置由各個 class 的 transform 決定 */
        }

        /* === 3. 跳棋動畫：左右跳動 + 縮放 === */
        @keyframes checkers-jump-move {
            0% { transform: translateX(0) scale(1); box-shadow: 0 0 15px var(--cyber-blue); }
            25% { transform: translateX(-15px) scale(1.15); box-shadow: 0 0 30px var(--cyber-blue); } /* 左跳 */
            50% { transform: translateX(0) scale(1); box-shadow: 0 0 15px var(--cyber-blue); } /* 回中 */
            75% { transform: translateX(15px) scale(1.15); box-shadow: 0 0 30px var(--cyber-blue); } /* 右跳 */
            100% { transform: translateX(0) scale(1); box-shadow: 0 0 15px var(--cyber-blue); }
        }

        /* === 4. 拼圖動畫：聚合與散開 === */
        @keyframes puzzle-assemble {
            0%, 100% { transform: translate(0, 0); box-shadow: 0 0 5px rgba(0,0,0,0.5); }
            50% { transform: translate(var(--tx), var(--ty)); box-shadow: 0 0 15px var(--glow-color); }
        }

        /* === 5. 三角棋動畫：中心脈衝 === */
        @keyframes triangle-pulse-inner {
            0% { transform: translate(-50%, -50%) scale(0.8); box-shadow: 0 0 5px var(--neon-purple); }
            100% { transform: translate(-50%, -50%) scale(1.2); box-shadow: 0 0 20px var(--neon-purple); }
        }

        /* === 8. 大富翁動畫：棋子環繞地圖邊緣 === */
        @keyframes monopoly-patrol {
            0%, 100% { top: -5px; left: -5px; }
            25% { top: -5px; left: calc(100% - 5px); }
            50% { top: calc(100% - 5px); left: calc(100% - 5px); }
            75% { top: calc(100% - 5px); left: -5px; }
        }
        @keyframes monopoly-patrol-reverse {
            0%, 100% { bottom: -5px; right: -5px; }
            25% { bottom: -5px; right: calc(100% - 5px); }
            50% { bottom: calc(100% - 5px); right: calc(100% - 5px); }
            75% { bottom: calc(100% - 5px); right: -5px; }
        }

        /* 其他通用動畫 */
        @keyframes slow-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* === 背景視覺 === */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 120%, #1a2530 0%, var(--bg-deep) 70%),
                        linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.8) 100%);
            z-index: -2; animation: text-glitch 10s infinite alternate;
        }

        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(100, 255, 218, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(100, 255, 218, 0.03) 1px, transparent 1px);
            background-size: 50px 50px; pointer-events: none; z-index: -1;
            mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            animation: grid-drift 20s linear infinite;
        }

        /* === Iframe 容器 === */
        #game-frame-container {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 9999;
        }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        /* === Header === */
        header {
            padding: 70px 20px 40px; text-align: center; width: 100%;
            position: relative; animation: fade-in-up 1s ease-out;
        }

        h1 {
            margin: 0; font-size: 3rem; font-weight: 700; letter-spacing: 10px;
            color: var(--text-main); text-shadow: 0 0 20px rgba(100, 255, 218, 0.3);
            position: relative; display: inline-block;
        }

        h1::after {
            content: ""; display: block; width: 70%; height: 3px;
            background: linear-gradient(90deg, transparent 0%, var(--jade-glow) 20%, var(--neon-purple) 50%, var(--jade-glow) 80%, transparent 100%);
            background-size: 200% 100%; margin: 18px auto 0;
            box-shadow: 0 0 15px var(--jade-glow), 0 0 8px var(--neon-purple);
            animation: scan-light 3s ease-in-out infinite;
        }

        .subtitle {
            margin-top: 15px; font-family: 'Orbitron', monospace; color: var(--jade-glow);
            font-size: 0.8rem; letter-spacing: 3px; opacity: 0.8; text-transform: uppercase;
            animation: text-glitch 5s infinite;
        }

        /* === Container (修正為更小尺寸以適應RWD) === */
        .container {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); /* 縮小單格最小寬度 */
            gap: 20px; /* 縮小間隙 */
            width: 95%; max-width: 1200px; padding: 15px; padding-bottom: 80px;
        }

        /* === Game Card (整體內縮) === */
        .game-card {
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 6px; 
            padding: 25px 15px; /* 縮小上下左右內距 */
            text-align: center; text-decoration: none; color: var(--text-main);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer; opacity: 0;
            animation: fade-in-up 0.8s ease-out forwards, border-pulse 4s ease-in-out infinite;
        }

        /* 順序動畫，多加順位給新增的遊戲 */
        .game-card:nth-child(1) { animation-delay: 0.1s, 0s; }
        .game-card:nth-child(2) { animation-delay: 0.2s, 1s; }
        .game-card:nth-child(3) { animation-delay: 0.3s, 2s; }
        .game-card:nth-child(4) { animation-delay: 0.4s, 3s; }
        .game-card:nth-child(5) { animation-delay: 0.5s, 4s; }
        .game-card:nth-child(6) { animation-delay: 0.6s, 5s; }
        .game-card:nth-child(7) { animation-delay: 0.7s, 6s; }
        .game-card:nth-child(8) { animation-delay: 0.8s, 7s; } /* 為三角棋新增的動畫延遲 */
        .game-card:nth-child(9) { animation-delay: 0.9s, 8s; } /* 為大富翁新增的動畫延遲 */
        .game-card:nth-child(10) { animation-delay: 1.0s, 9s; } /* 為數獨新增的動畫延遲 */
        .game-card:nth-child(11) { animation-delay: 1.1s, 10s; } /* 為俄羅斯方塊新增的動畫延遲 */
        .game-card:nth-child(12) { animation-delay: 1.2s, 11s; } /* === [NEW] 為西洋棋新增的動畫延遲 === */
        .game-card:nth-child(13) { animation-delay: 1.3s, 12s; } /* === [NEW] 為塔防 (Tower Defense) 新增的動畫延遲 === */

        .game-card::before, .game-card::after {
            content: ""; position: absolute; width: 20px; height: 20px;
            border: 2px solid var(--jade-glow); transition: all 0.4s ease; opacity: 0.5;
        }
        .game-card::before { top: 0; left: 0; border-right: none; border-bottom: none; }
        .game-card::after { bottom: 0; right: 0; border-left: none; border-top: none; }

        .game-card:hover {
            opacity: 1; transform: translateY(-8px) scale(1.02);
            background: rgba(30, 40, 50, 0.8); border-color: var(--jade-glow);
            box-shadow: 0 0 35px rgba(100, 255, 218, 0.4); animation: none;
        }
        .game-card:hover::before, .game-card:hover::after {
            width: 100%; height: 100%; opacity: 1; border-color: rgba(100, 255, 218, 0.15);
        }

        /* === Icon Box & 通用 Hover 發光特效 (高度縮小) === */
        .icon-box {
            height: 85px; /* 縮小容器高度 */
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px; position: relative;
        }

        /* 1. 象棋 (常駐公轉 + 懸停發光) */
        .chess-orbit-container {
            width: 75px; height: 75px; /* 縮小 */
            position: relative; 
            /* 常駐動畫 */
            animation: orbit-rotate 5s linear infinite; 
        }
        .chess-piece {
            width: 36px; height: 36px; /* 縮小 */
            border-radius: 50%; border: 2px solid var(--text-main); position: absolute;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; /* 縮小字體 */
            font-weight: bold; font-family: 'Noto Serif TC', serif;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            background: radial-gradient(circle, #222 0%, #000 100%);
            /* 常駐反向自轉 */
            animation: counter-rotate 5s linear infinite, piece-pulse 3s infinite;
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        .c-shuai { color: var(--chess-red); border-color: #552222; top: 0; left: 0; z-index: 2; }
        .c-jiang { color: var(--chess-black); border-color: #113322; bottom: 0; right: 0; z-index: 1; }
        
        /* HOVER GLOW */
        .game-card:hover .chess-piece {
            box-shadow: 0 0 25px var(--text-main);
            border-color: #fff;
        }

        /* 2. 暗棋 (JS控制翻牌 + 懸停發光) */
        .icon-dark-box {
            width: 70px; height: 70px; /* 縮小 */
            position: relative;
        }
        .dc-card {
            width: 24px; height: 24px; /* 縮小 */
            position: absolute; background: #111;
            border: 1px solid var(--jade-glow);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; /* 縮小 */
            font-weight: bold; font-family: 'Noto Serif TC', serif;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s, border-color 0.3s;
            transform: scaleX(1); 
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        
        .dc-card.is-back {
            background: repeating-linear-gradient(45deg, #0a0a0a, #0a0a0a 2px, #1a1a1a 2px, #1a1a1a 4px);
            color: transparent; border-color: #333;
        }
        .dc-card.is-front {
            border-color: var(--jade-glow);
            box-shadow: 0 0 10px rgba(100, 255, 218, 0.3);
        }

        /* 佈局 */
        .dc-c1 { top: 0; left: 0; }
        .dc-c2 { top: 0; right: 0; }
        .dc-c3 { top: 50%; left: 50%; transform: translate(-50%, -50%) scaleX(1); }
        .dc-c4 { bottom: 0; left: 0; }
        .dc-c5 { bottom: 0; right: 0; }

        .dc-c3.is-flipping { transform: translate(-50%, -50%) scaleX(0); }
        .dc-card:not(.dc-c3).is-flipping { transform: scaleX(0); }

        /* HOVER GLOW */
        .game-card:hover .dc-card {
            box-shadow: 0 0 15px var(--jade-glow); border-color: #fff;
        }

        /* === 象棋麻將 (5張胡牌攤開 + JS控制過場) === */
        .icon-mj-box {
            position: relative; width: 90px; height: 60px;
            display: flex; align-items: center; justify-content: center; gap: 2px;
            perspective: 500px; /* 增加立體感以便翻轉 */
        }
        .mj-tile {
            width: 16px; height: 26px; /* 縮小以容納5張 */
            background: linear-gradient(135deg, #111, #222);
            border: 1px solid var(--glass-border); border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; font-family: 'Noto Serif TC', serif;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            /* 加入平滑過渡 */
            transition: transform 0.4s ease-in-out, opacity 0.4s ease-in-out, box-shadow 0.3s, border-color 0.3s;
            transform-style: preserve-3d;
        }
        .mj-tile.red { color: var(--chess-red); border-color: rgba(255, 77, 77, 0.4); }
        .mj-tile.black { color: var(--chess-black); border-color: rgba(0, 230, 118, 0.4); }
        
        /* 切換胡牌樣式時的翻轉動畫 */
        .mj-tile.is-flipping {
            transform: rotateX(90deg) scale(0.8);
            opacity: 0.3;
        }

        /* HOVER GLOW FOR CHESS MAHJONG */
        .game-card:hover .mj-tile {
            border-color: #fff; box-shadow: 0 0 10px #fff;
        }

        /* 3. 五子棋 (常駐米字 + 旋轉 + 懸停發光) */
        .icon-gomoku-container {
            width: 80px; height: 80px; /* 縮小 */
            position: relative;
            display: flex; align-items: center; justify-content: center;
            /* 常駐旋轉 */
            animation: gomoku-spin-slow 8s linear infinite;
        }
        .g-stone {
            width: 12px; height: 12px; /* 縮小 */
            border-radius: 50%; position: absolute;
            transition: box-shadow 0.3s, border-color 0.3s;
            top: 50%; left: 50%; 
            box-shadow: 0 0 5px rgba(0,0,0,0.8);
        }
        .gs-black { background: #111; border: 1px solid #444; }
        .gs-white { background: #eee; border: 1px solid #ccc; }

        /* 直接定義擴散後的位置 */
        .stone-c { transform: translate(-50%, -50%); } 
        .stone-l { transform: translate(-250%, -50%); }
        .stone-r { transform: translate(150%, -50%); }
        .stone-t { transform: translate(-50%, -250%); }
        .stone-b { transform: translate(-50%, 150%); }
        .stone-tl { transform: translate(-200%, -200%); }
        .stone-tr { transform: translate(100%, -200%); }
        .stone-bl { transform: translate(-200%, 100%); }
        .stone-br { transform: translate(100%, 100%); }

        /* HOVER GLOW */
        .game-card:hover .g-stone { box-shadow: 0 0 12px #fff; border-color: #fff; }

        /* 4. 黑白棋 (常駐旋轉 + 懸停發光) */
        .icon-othello {
            width: 60px; height: 60px; /* 縮小 */
            border-radius: 50%;
            background: linear-gradient(135deg, var(--text-main) 50%, #000 50%);
            border: 2px solid #666; box-shadow: 0 0 20px rgba(255,255,255,0.15);
            /* 常駐旋轉 */
            animation: slow-rotate 10s linear infinite;
            transition: box-shadow 0.3s;
        }
        /* HOVER GLOW */
        .game-card:hover .icon-othello { box-shadow: 0 0 30px rgba(255,255,255,0.8); border-color: #fff; }

        /* 5. 跳棋 (常駐跳動 + 懸停發光) */
        .icon-checkers {
            width: 55px; height: 55px; /* 縮小 */
            border: 3px solid var(--cyber-blue);
            border-radius: 50%; position: relative;
            display: flex; align-items: center; justify-content: center;
            /* 常駐跳動 */
            animation: checkers-jump-move 2s infinite ease-in-out;
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        .icon-checkers::after {
            content: ""; width: 24px; height: 24px; /* 縮小 */
            background: var(--cyber-blue);
            border-radius: 50%; box-shadow: 0 0 15px var(--cyber-blue);
            transition: background 0.3s, box-shadow 0.3s;
        }
        .icon-checkers::before {
            content: ""; position: absolute; width: 100%; height: 100%;
            border-radius: 50%; border: 1px solid var(--cyber-blue); opacity: 0.5;
        }
        
        /* HOVER GLOW */
        .game-card:hover .icon-checkers { box-shadow: 0 0 30px var(--cyber-blue); border-color: #fff; }
        .game-card:hover .icon-checkers::after { background: #fff; box-shadow: 0 0 40px var(--cyber-blue); }

        /* 6. 拼圖 (常駐聚合散開 + 懸停發光) */
        .icon-puzzle-box {
            width: 70px; height: 70px; /* 縮小 */
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .p-piece {
            width: 30px; height: 30px; /* 縮小 */
            position: absolute; border: 2px solid; background: rgba(0,0,0,0.5);
            transition: box-shadow 0.3s, border-color 0.3s;
            animation: puzzle-assemble 4s infinite ease-in-out;
        }
        /* 四個拼圖塊的位置與顏色 */
        .pp-1 { top: 0; left: 0; border-color: var(--jade-glow); --tx: -5px; --ty: -5px; --glow-color: var(--jade-glow); }
        .pp-2 { top: 0; right: 0; border-color: var(--neon-purple); --tx: 5px; --ty: -5px; --glow-color: var(--neon-purple); }
        .pp-3 { bottom: 0; left: 0; border-color: var(--cyber-blue); --tx: -5px; --ty: 5px; --glow-color: var(--cyber-blue); }
        .pp-4 { bottom: 0; right: 0; border-color: var(--text-main); --tx: 5px; --ty: 5px; --glow-color: var(--text-main); }

        /* HOVER GLOW */
        .game-card:hover .p-piece { box-shadow: 0 0 20px var(--glow-color); border-color: #fff; }

        /* 7. 三角棋 (常駐三角形輪廓旋轉 + 中心脈衝 + 懸停發光) */
        .icon-triangle-box {
            width: 60px; height: 60px; position: relative;
            animation: slow-rotate 8s linear infinite; /* 常駐旋轉 */
        }
        .icon-triangle-box::before {
            content: ""; position: absolute; top: 10%; left: 50%; width: 0; height: 0;
            border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 35px solid rgba(100,255,218,0.2);
            transform: translateX(-50%);
            filter: drop-shadow(0 0 5px var(--jade-glow));
            transition: all 0.3s;
        }
        .t-node {
            width: 12px; height: 12px; background: var(--bg-deep);
            border: 2px solid var(--jade-glow); border-radius: 50%; position: absolute;
            box-shadow: 0 0 10px var(--jade-glow);
            animation: piece-pulse 2s infinite;
        }
        /* 三角形頂點配置 */
        .t-n1 { top: 5%; left: 50%; transform: translateX(-50%); }
        .t-n2 { bottom: 15%; left: 5%; }
        .t-n3 { bottom: 15%; right: 5%; }

        /* 中心脈衝節點 */
        .t-center {
            width: 16px; height: 16px; background: var(--neon-purple); border-radius: 50%;
            position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 15px var(--neon-purple);
            animation: triangle-pulse-inner 2s infinite alternate;
        }

        /* HOVER GLOW FOR TRIANGLE CHESS */
        .game-card:hover .icon-triangle-box::before { border-bottom-color: rgba(100,255,218,0.6); filter: drop-shadow(0 0 10px var(--jade-glow)); }
        .game-card:hover .t-node { background: var(--jade-glow); box-shadow: 0 0 20px #fff; }
        .game-card:hover .t-center { background: #fff; box-shadow: 0 0 30px var(--neon-purple); }

        /* === 8. 大富翁圖示專屬 CSS === */
        .icon-monopoly-box {
            width: 60px; height: 60px;
            position: relative;
            border: 4px solid var(--glass-border);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }
        /* 內部地圖裝飾 (模擬大富翁中間的空地與機會命運卡) */
        .icon-monopoly-box::before {
            content: "?";
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px dashed var(--glass-border);
            background: var(--bg-deep);
            color: var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', monospace; font-size: 14px; font-weight: bold;
            transition: all 0.3s;
        }
        
        /* 兩顆跑動的棋子 */
        .m-token {
            width: 10px; height: 10px;
            position: absolute;
            border-radius: 50%;
            z-index: 2;
        }
        .m-token.t1 {
            background: var(--chess-red);
            box-shadow: 0 0 8px var(--chess-red);
            animation: monopoly-patrol 4s linear infinite;
        }
        .m-token.t2 {
            background: var(--cyber-blue);
            box-shadow: 0 0 8px var(--cyber-blue);
            animation: monopoly-patrol-reverse 5s linear infinite;
        }

        /* HOVER GLOW FOR MONOPOLY */
        .game-card:hover .icon-monopoly-box { border-color: var(--jade-glow); box-shadow: 0 0 15px rgba(100, 255, 218, 0.3); }
        .game-card:hover .icon-monopoly-box::before { border-color: var(--cyber-blue); color: var(--jade-glow); text-shadow: 0 0 5px var(--jade-glow); }
        .game-card:hover .m-token.t1 { box-shadow: 0 0 15px #fff; background: #fff; }
        .game-card:hover .m-token.t2 { box-shadow: 0 0 15px #fff; background: #fff; }

        /* === 9. 數獨圖示專屬 CSS (9宮格佈局) === */
        .icon-sudoku-box {
            width: 66px; height: 66px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            padding: 2px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--glass-border);
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        /* 單一宮格數字 */
        .sudoku-cell {
            background: rgba(255, 255, 255, 0.05);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.4s ease, opacity 0.4s ease, box-shadow 0.3s;
        }

        /* 數字重置時的縮放隱藏動畫 */
        .sudoku-cell.is-updating {
            transform: scale(0);
            opacity: 0;
        }

        /* HOVER GLOW FOR SUDOKU */
        .game-card:hover .icon-sudoku-box { border-color: var(--jade-glow); box-shadow: 0 0 15px rgba(100, 255, 218, 0.3); }
        .game-card:hover .sudoku-cell { background: rgba(100, 255, 218, 0.1); box-shadow: inset 0 0 5px rgba(255,255,255,0.2); }

        /* === 10. 俄羅斯方塊圖示專屬 CSS (10種隨機掉落、堆疊) === */
        .icon-tetris-box {
            width: 60px; height: 60px;
            position: relative;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--glass-border);
            border-radius: 4px;
            overflow: hidden;
            transition: all 0.3s;
            transform: scale(1.3); /* <--- 加上這行放大 120% */
        }
        /* 背景網格點綴，增加復古遊戲感 */
        .icon-tetris-box::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 10px 10px;
            z-index: 0;
        }
        /* 基礎方塊外觀 */
        .tetris-shape {
            position: absolute;
            width: 10px; height: 10px;
            box-sizing: border-box;
            transition: filter 0.3s;
            z-index: 1;
        }

        /* 以下為 10 種不同形狀與顏色的定義 (利用 box-shadow 畫出其他格子) */
        /* 1. I 型 (Cyber Blue) */
        .ts-1 { background: #00b4d8; color: #00b4d8; box-shadow: 0 10px 0 currentColor, 0 20px 0 currentColor, 0 30px 0 currentColor; }
        /* 2. J 型 (藍色) */
        .ts-2 { background: #2196f3; color: #2196f3; box-shadow: 0 10px 0 currentColor, 0 20px 0 currentColor, -10px 20px 0 currentColor; }
        /* 3. L 型 (橘色) */
        .ts-3 { background: #ff9f1c; color: #ff9f1c; box-shadow: 0 10px 0 currentColor, 0 20px 0 currentColor, 10px 20px 0 currentColor; }
        /* 4. O 型 (黃色) */
        .ts-4 { background: #f9cb28; color: #f9cb28; box-shadow: 10px 0 0 currentColor, 0 10px 0 currentColor, 10px 10px 0 currentColor; }
        /* 5. S 型 (綠色) */
        .ts-5 { background: #00e676; color: #00e676; box-shadow: 10px 0 0 currentColor, -10px 10px 0 currentColor, 0 10px 0 currentColor; }
        /* 6. T 型 (紫色) */
        .ts-6 { background: #bd34fe; color: #bd34fe; box-shadow: -10px 0 0 currentColor, 10px 0 0 currentColor, 0 10px 0 currentColor; }
        /* 7. Z 型 (紅色) */
        .ts-7 { background: #ff4d4d; color: #ff4d4d; box-shadow: -10px 0 0 currentColor, 0 10px 0 currentColor, 10px 10px 0 currentColor; }
        /* 8. 單點 (銀灰) */
        .ts-8 { background: #dcdfe3; color: #dcdfe3; box-shadow: none; }
        /* 9. 骨牌 1x2 (粉紅) */
        .ts-9 { background: #ff499e; color: #ff499e; box-shadow: 0 10px 0 currentColor; }
        /* 10. 十字型 (青玉光) */
        .ts-10 { background: #64ffda; color: #64ffda; box-shadow: -10px 0 0 currentColor, 10px 0 0 currentColor, 0 -10px 0 currentColor, 0 10px 0 currentColor; }

        /* 動態方塊專用掉落動畫 (單次動畫耗時 1.2 秒) */
        .is-dropping {
            animation: tetris-drop-dynamic 1.2s cubic-bezier(0.8, 0, 0.2, 1) both;
        }
        @keyframes tetris-drop-dynamic {
            0% { top: -40px; opacity: 0; transform: scale(1); }
            10% { top: -40px; opacity: 1; transform: scale(1); } /* 開始顯現並掉落 */
            50% { top: var(--end-y, 20px); opacity: 1; transform: scale(1); } /* 掉落到隨機堆疊高度 */
            75% { top: var(--end-y, 20px); opacity: 1; transform: scale(1); filter: brightness(1.5); } /* 短暫停留並閃爍 */
            90%, 100% { top: var(--end-y, 20px); opacity: 0; transform: scale(0.8); } /* 縮小消失 */
        }

        /* HOVER GLOW FOR TETRIS */
        .game-card:hover .icon-tetris-box { border-color: var(--neon-purple); box-shadow: 0 0 15px rgba(189, 52, 254, 0.3); }
        .game-card:hover .tetris-shape { filter: drop-shadow(0 0 3px currentColor) brightness(1.2); }

        /* === [NEW] 11. 西洋棋圖示專屬 CSS (繞圈自轉交替) === */
        .icon-western-chess-box {
            width: 60px; height: 60px;
            position: relative;
            border-radius: 4px;
            border: 2px solid var(--glass-border);
            /* 微型西洋棋盤背景 */
            background: linear-gradient(45deg, rgba(255,255,255,0.05) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.05) 75%, rgba(255,255,255,0.05)), 
                        linear-gradient(45deg, rgba(255,255,255,0.05) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.05) 75%, rgba(255,255,255,0.05));
            background-color: rgba(0, 0, 0, 0.4);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
            overflow: hidden;
            transform: scale(1.3); /* <--- 加上這行放大 120% */
        }

        /* 繞圈公轉容器 */
        .w-chess-orbit {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
        }

        /* 棋子外層容器，負責抵消公轉的自轉，讓棋子保持直立 */
        .w-chess-piece {
            position: absolute;
            width: 30px; height: 30px;
            left: 15px; /* 置中 (60 - 30) / 2 */
            display: flex; align-items: center; justify-content: center;
            font-family: Arial, sans-serif;
        }

        /* 棋子實體與懸停特效 */
        .w-chess-piece span {
            font-size: 24px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            transition: transform 0.3s, filter 0.3s;
        }

        /* 一紅一綠佈局 (上下分佈) */
        .w-piece-red { top: 2px; color: var(--chess-red); }
        .w-piece-green { bottom: 2px; color: var(--chess-black); /* 這是主題科技綠色 */ }

        /* 動畫：控制公轉繞圈 (0~360度) */
        @keyframes w-orbit-cw { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes w-orbit-ccw { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
        
        /* 動畫：控制自轉抵消，讓棋子永保直立 (-360~0度) */
        @keyframes w-counter-cw { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
        @keyframes w-counter-ccw { 0% { transform: rotate(-360deg); } 100% { transform: rotate(0deg); } }

        /* 使用 forwards 確保在 JS 觸發交替前，動畫能完美停留在 360/0 度的最後影格，避免閃爍跳格 */
        .w-spin-cw { animation: w-orbit-cw 2s linear forwards; }
        .w-spin-ccw { animation: w-orbit-ccw 2s linear forwards; }
        .w-counter-cw { animation: w-counter-cw 2s linear forwards; }
        .w-counter-ccw { animation: w-counter-ccw 2s linear forwards; }

        /* HOVER GLOW FOR WESTERN CHESS */
        .game-card:hover .icon-western-chess-box { border-color: var(--cyber-blue); box-shadow: 0 0 15px rgba(0, 180, 216, 0.3); }
        .game-card:hover .w-piece-red span { color: #fff; filter: drop-shadow(0 0 10px var(--chess-red)); transform: scale(1.2); }
        .game-card:hover .w-piece-green span { color: #fff; filter: drop-shadow(0 0 10px var(--chess-black)); transform: scale(1.2); }

        /* === [NEW] 12. 塔防圖示專屬 CSS（路徑流光、敵人巡邏、砲塔脈衝、子彈射擊） === */
        /*
         * 視覺隱喻：迷你戰場網格 + L 形敵軍路徑 + 砲塔置於草地格 + 敵人沿路移動 + 週期性射擊子彈。
         * 動畫皆為純 CSS，呼應 TD 類型遊戲「守路、蓋塔、清怪」。
         * [調色] 網格／路徑／砲塔／敵彈整體提高彩度與亮度，避免深色底上過暗難辨識。
         */
        @keyframes td-path-shimmer {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }
        @keyframes td-enemy-patrol {
            0% { left: 8%; top: 62%; opacity: 1; transform: translate(-50%, -50%) scale(1); }
            22% { left: 38%; top: 62%; opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
            45% { left: 38%; top: 30%; opacity: 1; transform: translate(-50%, -50%) scale(1); }
            68% { left: 72%; top: 30%; opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
            90% { left: 72%; top: 58%; opacity: 0.92; transform: translate(-50%, -50%) scale(1); }
            100% { left: 8%; top: 62%; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        /* 砲塔脈衝：加強外光／內嵌高光，峰值更亮 */
        @keyframes td-tower-glow {
            0%, 100% {
                box-shadow:
                    0 0 10px rgba(100, 255, 218, 0.75),
                    0 0 18px rgba(0, 229, 255, 0.45),
                    inset 0 0 12px rgba(0, 245, 212, 0.42);
                filter: brightness(1.05) saturate(1.25);
            }
            50% {
                box-shadow:
                    0 0 22px rgba(100, 255, 218, 1),
                    0 0 28px rgba(189, 52, 254, 0.65),
                    inset 0 0 16px rgba(189, 52, 254, 0.5);
                filter: brightness(1.28) saturate(1.45);
            }
        }
        /* 射程漣漪：提高各影格不透明度，邊框色見 .td-range */
        @keyframes td-range-ripple {
            0% { transform: translate(-50%, -50%) scale(0.65); opacity: 0.82; }
            70% { opacity: 0.42; }
            100% { transform: translate(-50%, -50%) scale(1.35); opacity: 0; }
        }
        @keyframes td-shot-burst {
            0% { left: 22%; top: 38%; opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
            15% { opacity: 1; }
            55% { left: 48%; top: 48%; opacity: 1; }
            100% { left: 62%; top: 55%; opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
        }
        /* 底圖網格呼吸：略提亮，讓格線較易被察覺 */
        @keyframes td-grid-drift-td {
            0% { opacity: 0.52; }
            50% { opacity: 0.78; }
            100% { opacity: 0.52; }
        }

        .icon-td-box {
            width: 72px;
            height: 72px;
            position: relative;
            border-radius: 8px;
            /* 邊框略亮於預設 glass，內層改深藍綠底（比純黑更有層次） */
            border: 2px solid rgba(100, 255, 218, 0.38);
            background:
                linear-gradient(90deg, rgba(100, 255, 218, 0.14) 1px, transparent 1px),
                linear-gradient(rgba(100, 255, 218, 0.14) 1px, transparent 1px),
                linear-gradient(145deg, rgba(12, 42, 48, 0.92) 0%, rgba(6, 14, 22, 0.88) 100%);
            background-size: 14px 14px, 14px 14px, auto;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s;
            animation: td-grid-drift-td 3.5s ease-in-out infinite;
        }
        /* L 形「道路」：提高青色路帶不透明度，路徑更醒目 */
        .icon-td-box .td-path-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, transparent 0%, transparent 32%, rgba(0, 230, 251, 0.52) 32%, rgba(0, 230, 251, 0.52) 68%, transparent 68%),
                linear-gradient(180deg, transparent 0%, transparent 28%, rgba(56, 189, 248, 0.48) 28%, rgba(56, 189, 248, 0.48) 58%, transparent 58%);
            mix-blend-mode: screen;
        }
        /* 水平流光條：提高不透明度並加亮邊緣色 stop */
        .icon-td-box .td-path-glow {
            position: absolute;
            left: 32%;
            top: 58%;
            width: 42%;
            height: 6px;
            border-radius: 3px;
            transform: translate(-50%, -50%) rotate(0deg);
            background: linear-gradient(90deg, transparent, #7efff0, #22d3ee, #60a5fa, transparent);
            background-size: 200% 100%;
            opacity: 0.96;
            filter: saturate(1.35) brightness(1.12);
            animation: td-path-shimmer 2.2s linear infinite;
        }
        .icon-td-box .td-path-glow-v {
            position: absolute;
            left: 56%;
            top: 36%;
            width: 6px;
            height: 38%;
            border-radius: 3px;
            transform: translate(-50%, -50%);
            background: linear-gradient(180deg, transparent, #e879f9, #a78bfa, #5eead4, transparent);
            background-size: 100% 200%;
            opacity: 0.92;
            filter: saturate(1.4) brightness(1.1);
            animation: td-path-shimmer 2.6s linear infinite reverse;
        }
        /* 砲塔：塔身改較亮金屬色，邊線與常駐陰影加強 */
        .icon-td-box .td-tower {
            position: absolute;
            left: 22%;
            top: 38%;
            width: 14px;
            height: 18px;
            border-radius: 3px 3px 2px 2px;
            background: linear-gradient(180deg, #3d5668 0%, #152028 100%);
            border: 1px solid rgba(120, 255, 236, 0.85);
            box-shadow: 0 0 12px rgba(100, 255, 218, 0.65), 0 0 6px rgba(0, 180, 216, 0.5);
            z-index: 3;
            animation: td-tower-glow 2s ease-in-out infinite;
        }
        .icon-td-box .td-tower::after {
            content: "";
            position: absolute;
            top: -5px;
            left: 50%;
            width: 8px;
            height: 6px;
            margin-left: -4px;
            background: linear-gradient(180deg, #7dd3fc, #0ea5e9);
            border-radius: 2px;
            box-shadow: 0 0 10px #38bdf8, 0 0 4px #e0f2fe;
        }
        /* 射程圈漣漪（塔防經典「圈選範圍」暗示）：邊線加粗、顏色更鮮 */
        .icon-td-box .td-range {
            position: absolute;
            left: 22%;
            top: 44%;
            width: 36px;
            height: 36px;
            margin-left: -18px;
            margin-top: -18px;
            border: 2px solid rgba(94, 234, 212, 0.85);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(45, 212, 191, 0.55);
            z-index: 2;
            animation: td-range-ripple 2.4s ease-out infinite;
        }
        /* 敵人單位：提高紅／橘高光與外光強度 */
        .icon-td-box .td-enemy {
            position: absolute;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffcdd2, #ff5252 45%, #c62828 100%);
            border: 1px solid rgba(255, 205, 210, 0.9);
            box-shadow: 0 0 12px rgba(255, 59, 48, 0.95), 0 0 6px rgba(255, 235, 59, 0.55);
            z-index: 4;
            animation: td-enemy-patrol 4.5s linear infinite;
        }
        /* 砲塔開火：子彈芯更亮、光暈範圍加大 */
        .icon-td-box .td-bullet {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #5effea 55%, #00e5ff 100%);
            box-shadow: 0 0 14px #5effea, 0 0 22px rgba(0, 229, 255, 0.85);
            z-index: 5;
            animation: td-shot-burst 1.1s ease-in infinite;
            animation-delay: 0.15s;
        }
        /* HOVER GLOW FOR TOWER DEFENSE */
        .game-card:hover .icon-td-box {
            border-color: #9fffea;
            box-shadow: 0 0 26px rgba(100, 255, 218, 0.55);
        }
        .game-card:hover .icon-td-box .td-enemy {
            box-shadow: 0 0 16px #fff, 0 0 12px rgba(255, 82, 82, 0.9);
        }
        .game-card:hover .icon-td-box .td-tower {
            border-color: #ecfeff;
        }

        /* 文字樣式 */
        .game-title {
            font-size: 1.3rem; /* 微幅縮小 */
            font-weight: 700; letter-spacing: 5px; display: block; margin-top: 10px;
        }
        .game-en-title {
            font-family: 'Orbitron', monospace; font-size: 0.75rem; /* 微幅縮小 */
            color: var(--jade-glow); opacity: 0.6; letter-spacing: 2px;
            margin-top: 8px; display: block; transition: opacity 0.3s;
        }
        .game-card:hover .game-en-title { opacity: 1; text-shadow: 0 0 8px var(--jade-glow); }

        /* === Footer === */
        .footer {
            margin-top: auto; padding: 30px; font-size: 0.75rem;
            font-family: 'Orbitron', monospace; color: #666; text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05); width: 100%;
            background: linear-gradient(to top, #000, transparent);
        }

        /* === 手機適配更新 (雙欄配置 + 整體比例微調) === */
        @media (max-width: 480px) {
            h1 { font-size: 2rem; } /* 配合版面適當縮小標題 */
            h1::after { width: 80%; }
            /* 改為 2 欄式，並縮小間隙與內距以完美適應雙欄空間 */
            .container { 
                grid-template-columns: repeat(2, 1fr); 
                width: 95%; 
                gap: 12px; 
                padding: 10px; 
                padding-bottom: 60px; 
            } 
            .icon-box { height: 65px; margin-bottom: 10px; }
            .game-card { padding: 15px 8px; }
            .game-title { font-size: 1.1rem; margin-top: 5px; letter-spacing: 3px; }
            .game-en-title { font-size: 0.65rem; margin-top: 4px; }
            
            /* 所有遊戲圖示按比例再次微幅縮小，確保於雙欄 RWD 中不跑版，且特效依舊滑順 */
            .chess-orbit-container { width: 55px; height: 55px; }
            .chess-piece { width: 28px; height: 28px; font-size: 14px; }
            
            .icon-dark-box { width: 50px; height: 50px; }
            .dc-card { width: 18px; height: 18px; font-size: 11px; }

            .icon-mj-box { width: 70px; height: 45px; gap: 2px;}
            .mj-tile { width: 12px; height: 18px; font-size: 10px; }
            
            .icon-othello { width: 45px; height: 45px; }
            .icon-checkers { width: 45px; height: 45px; border-width: 2px;}
            .icon-checkers::after { width: 18px; height: 18px; }
            .icon-gomoku-container { width: 60px; height: 60px; }
            .g-stone { width: 9px; height: 9px; }

            .icon-puzzle-box { width: 50px; height: 50px; }
            .p-piece { width: 22px; height: 22px; }

            /* 三角棋手機版雙欄微調 */
            .icon-triangle-box { width: 45px; height: 45px; }
            .icon-triangle-box::before { border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 20px solid rgba(100,255,218,0.2); top: 15%; }
            .t-node { width: 8px; height: 8px; border-width: 1px;}
            .t-center { width: 10px; height: 10px; }

            /* 大富翁手機版雙欄微調 */
            .icon-monopoly-box { width: 45px; height: 45px; border-width: 2px;}
            .icon-monopoly-box::before { top: 6px; left: 6px; right: 6px; bottom: 6px; font-size: 10px;}

            /* 數獨手機版雙欄微調 */
            .icon-sudoku-box { width: 48px; height: 48px; padding: 1px; gap: 1px; }

<script>
    function openGame(url) {
        const lobby = document.getElementById('lobby');
        const container = document.getElementById('game-frame-container');
        const iframe = document.getElementById('game-iframe');
        iframe.src = url;
        lobby.style.display = 'none';
        container.style.display = 'block';
    }

    function closeGame() {
        const lobby = document.getElementById('lobby');
        const container = document.getElementById('game-frame-container');
        const iframe = document.getElementById('game-iframe');
        iframe.src = "";
        container.style.display = 'none';
        lobby.style.display = 'flex';
        lobby.style.flexDirection = 'column';
    }

    // === 暗棋動畫邏輯 ===
    (function startDarkChessAnimation() {
        const cards = document.querySelectorAll('.dc-card');
        const pieces = [
            { t: '帥', c: 'red' }, { t: '將', c: 'black' },
            { t: '仕', c: 'red' }, { t: '士', c: 'black' },
            { t: '相', c: 'red' }, { t: '象', c: 'black' },
            { t: '俥', c: 'red' }, { t: '車', c: 'black' },
            { t: '傌', c: 'red' }, { t: '馬', c: 'black' },
            { t: '炮', c: 'red' }, { t: '包', c: 'black' },
            { t: '兵', c: 'red' }, { t: '卒', c: 'black' }
        ];

        function flipSequence() {
            cards.forEach(card => card.classList.add('is-flipping'));

            setTimeout(() => {
                cards.forEach(card => {
                    card.classList.remove('is-front');
                    card.classList.add('is-back');
                    card.innerText = '';
                    card.style.color = 'transparent';
                });

                const shuffled = [...pieces].sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, 5);

                cards.forEach((card, index) => {
                    card.dataset.char = selected[index].t;
                    card.dataset.color = selected[index].c;
                });

                setTimeout(() => {
                    cards.forEach((card, index) => {
                        card.classList.remove('is-back');
                        card.classList.add('is-front');
                        card.innerText = card.dataset.char;
                        card.style.color = (card.dataset.color === 'red') ? '#ff4d4d' : '#00e676';
                        card.classList.remove('is-flipping');
                    });
                }, 100);

            }, 300);

            setTimeout(() => {
                 cards.forEach(card => card.classList.add('is-flipping'));
                 setTimeout(() => {
                    cards.forEach(card => {
                        card.classList.remove('is-front');
                        card.classList.add('is-back');
                        card.innerText = '';
                        card.style.color = 'transparent';
                        card.classList.remove('is-flipping');
                    });
                 }, 300);
            }, 2500); 
        }
        setInterval(flipSequence, 3500);
        flipSequence();
    })();

    // === 象棋麻將動畫邏輯 (每2秒切換一次胡牌樣子) ===
    (function startMahjongAnimation() {
        const mjContainer = document.getElementById('mj-container');
        if (!mjContainer) return;
        const tiles = mjContainer.querySelectorAll('.mj-tile');
        
        // 定義 5 種代表胡牌的牌型組合 (依照使用者要求更新)
        const winningHands = [
            // 1. 將士象兵兵 (將/士/象 黑色, 兵 紅色)
            [{ t: '將', c: 'black' }, { t: '士', c: 'black' }, { t: '象', c: 'black' }, { t: '兵', c: 'red' }, { t: '兵', c: 'red' }],
            // 2. 帥仕相卒卒 (帥/仕/相 紅色, 卒 黑色)
            [{ t: '帥', c: 'red' }, { t: '仕', c: 'red' }, { t: '相', c: 'red' }, { t: '卒', c: 'black' }, { t: '卒', c: 'black' }],
            // 3. 卒卒卒兵兵 (卒 黑色, 兵 紅色)
            [{ t: '卒', c: 'black' }, { t: '卒', c: 'black' }, { t: '卒', c: 'black' }, { t: '兵', c: 'red' }, { t: '兵', c: 'red' }],
            // 4. 車馬包兵兵 (車/馬/包 黑色, 兵 紅色)
            [{ t: '車', c: 'black' }, { t: '馬', c: 'black' }, { t: '包', c: 'black' }, { t: '兵', c: 'red' }, { t: '兵', c: 'red' }],
            // 5. 俥傌炮卒卒 (俥/傌/炮 紅色, 卒 黑色)
            [{ t: '俥', c: 'red' }, { t: '傌', c: 'red' }, { t: '炮', c: 'red' }, { t: '卒', c: 'black' }, { t: '卒', c: 'black' }]
        ];

        let currentHandIndex = 0;

        function changeHand() {
            // 1. 讓牌往後倒 (模擬洗牌/翻牌)
            tiles.forEach(tile => tile.classList.add('is-flipping'));

            // 2. 等待翻倒動畫一半時，替換文字和顏色，再翻回來
            setTimeout(() => {
                currentHandIndex = (currentHandIndex + 1) % winningHands.length;
                const newHand = winningHands[currentHandIndex];

                tiles.forEach((tile, index) => {
                    tile.innerText = newHand[index].t;
                    // 重置 className 確保移除前一個顏色，並加入新顏色
                    tile.className = 'mj-tile ' + newHand[index].c; 
                });
            }, 400); // 對應 CSS 中 0.4s 的 transition
        }

        // 每 2000 毫秒 (2秒) 執行一次胡牌變換
        setInterval(changeHand, 2000);
    })();

    // === 數獨動畫邏輯 (定時刷新 1~9 與 9種顏色) ===
    (function startSudokuAnimation() {
        const container = document.getElementById('sudoku-container');
        if (!container) return;
        const cells = container.querySelectorAll('.sudoku-cell');
        
        // 從主題色系中挑選 9 種適合深色背景的科技光芒配色
        const colors = [
            '#64ffda', /* 青玉光 */
            '#00b4d8', /* 科技藍 */
            '#bd34fe', /* 霓虹紫 */
            '#ff4d4d', /* 亮紅 */
            '#00e676', /* 科技綠 */
            '#f9cb28', /* 霓虹黃 */
            '#ff9f1c', /* 活力橘 */
            '#ff499e', /* 電馭粉 */
            '#9bf6ff'  /* 冰藍色 */
        ];

        function refreshSudoku() {
            // 1. 先加上 class 讓數字縮小隱藏
            cells.forEach(cell => cell.classList.add('is-updating'));

            setTimeout(() => {
                // 2. 產生 1~9 的不重複陣列並打亂 (洗牌演算法)
                let nums = [1, 2, 3, 4, 5, 6, 7, 8, 9];
                nums.sort(() => Math.random() - 0.5);

                // 產生 9 種顏色的隨機排列，確保每次 9 宮格內顏色都不重複
                let currentColors = [...colors];
                currentColors.sort(() => Math.random() - 0.5);

                // 3. 更新宮格內容與隨機派發顏色
                cells.forEach((cell, index) => {
                    cell.innerText = nums[index];
                    const cColor = currentColors[index];
                    cell.style.color = cColor;
                    cell.style.textShadow = `0 0 5px ${cColor}`;
                });

                // 4. 移除 class 讓數字放大浮現
                cells.forEach(cell => cell.classList.remove('is-updating'));
            }, 400); // 對應 CSS 中的 0.4s 動畫時間
        }

        // 初始化與定時器 (每3.5秒刷新一次)
        refreshSudoku();
        setInterval(refreshSudoku, 3500);
    })();

    // === 俄羅斯方塊動畫邏輯 (每2秒為一循環：1秒內依序掉落3個方塊並隨機堆疊) ===
    (function startTetrisAnimation() {
        const container = document.getElementById('tetris-container');
        if (!container) return;

        // 定義 CSS 中對應的 10 個方塊 class
        const shapes = ['ts-1', 'ts-2', 'ts-3', 'ts-4', 'ts-5', 'ts-6', 'ts-7', 'ts-8', 'ts-9', 'ts-10'];

        function dropRandomShapes() {
            // 1. 清空上一次的方塊
            container.innerHTML = '';

            // 2. 隨機選取 3 個不重複的方塊 (確保形狀與顏色不同)
            const shuffledShapes = [...shapes].sort(() => 0.5 - Math.random());
            const selectedShapes = shuffledShapes.slice(0, 3);

            selectedShapes.forEach((selectedShape, index) => {
                // 3. 建立方塊元素並賦予 class
                const shapeDiv = document.createElement('div');
                shapeDiv.className = `tetris-shape is-dropping ${selectedShape}`;
                
                // 4. 賦予方塊在容器內隨機水平偏移 (左側 5px ~ 35px 之間，確保不出界)
                const randomX = Math.floor(Math.random() * 30) + 5;
                shapeDiv.style.left = `${randomX}px`;

                // 5. 賦予隨機的停止高度 (Y軸 15px ~ 35px)，模擬各自隨機堆疊的視覺效果
                const randomEndY = Math.floor(Math.random() * 20) + 15;
                shapeDiv.style.setProperty('--end-y', `${randomEndY}px`);

                // 6. 設定動畫延遲：1 秒內陸續掉落 3 個 (第1個 0s, 第2個 0.33s, 第3個 0.66s)
                shapeDiv.style.animationDelay = `${index * 0.33}s`;

                // 7. 推入容器以觸發 CSS Animation
                container.appendChild(shapeDiv);
            });
        }

        // 初始化並設定每 2000 毫秒 (2秒) 重新啟動一輪
        dropRandomShapes();
        setInterval(dropRandomShapes, 2000);
    })();

    // === [NEW] 西洋棋動畫邏輯 (2秒交替切換棋子並反轉公轉方向) ===
    (function startWesternChessAnimation() {
        const orbit = document.getElementById('wc-orbit');
        const p1 = document.getElementById('wc-p1');
        const p2 = document.getElementById('wc-p2');
        const p1Wrapper = document.getElementById('wc-p1-wrapper');
        const p2Wrapper = document.getElementById('wc-p2-wrapper');
        
        if (!orbit) return;

        // 10種西洋棋子符號 (國王、皇后、城堡、主教、騎士、士兵各兩款)
        const chessSymbols = ['♔', '♕', '♖', '♗', '♘', '♙', '♚', '♛', '♜', '♝'];
        let isCw = true; // 記錄當前是否為順時針旋轉

        function changeWesternChess() {
            // 1. 隨機抽取兩種棋子符號
            const random1 = chessSymbols[Math.floor(Math.random() * chessSymbols.length)];
            const random2 = chessSymbols[Math.floor(Math.random() * chessSymbols.length)];
            p1.innerText = random1;
            p2.innerText = random2;

            // 2. 切換動畫 class，利用 forwards 屬性完美銜接 360/0度 不會閃爍跳格
            if (isCw) {
                // 改為逆時針 (且棋子需套用對應的逆向自轉抵消)
                orbit.className = 'w-chess-orbit w-spin-ccw';
                p1Wrapper.className = 'w-chess-piece w-piece-red w-counter-ccw';
                p2Wrapper.className = 'w-chess-piece w-piece-green w-counter-ccw';
            } else {
                // 改為順時針 (且棋子需套用對應的順向自轉抵消)
                orbit.className = 'w-chess-orbit w-spin-cw';
                p1Wrapper.className = 'w-chess-piece w-piece-red w-counter-cw';
                p2Wrapper.className = 'w-chess-piece w-piece-green w-counter-cw';
            }
            
            // 狀態反轉，準備下一次切換
            isCw = !isCw;
        }

        // 頁面載入時初始化第一次轉動 (順時針)
        orbit.className = 'w-chess-orbit w-spin-cw';
        p1Wrapper.className = 'w-chess-piece w-piece-red w-counter-cw';
        p2Wrapper.className = 'w-chess-piece w-piece-green w-counter-cw';

        // 設定定時器：每2秒執行一次切換方向與棋子 (2000毫秒對應 CSS 中的 2s 動畫時間)
        setInterval(changeWesternChess, 2000);
    })();

    // 安全防護
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function(e) {
        if (e.keyCode == 123) return false;
        if (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) return false;
        if (e.ctrlKey && (e.keyCode == 'U'.charCodeAt(0) || e.keyCode == 'S'.charCodeAt(0))) return false;
    };
    console.log("%c系統安全監控中", "color: #64ffda; font-size: 30px; font-weight: bold; background: #000; padding: 10px;");
</script>
