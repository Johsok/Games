<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#3a3a3a">
    <title>大理石西洋棋 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        /* === 核心變數與配色定義 === */
        :root {
            --bg-grad: radial-gradient(circle at center, #3a3a3a, #1a1a1a);
            --board-border: #333;
            --dark-square: #6b6b6b;
            --light-square: #dcdcdc;
            --selected-border: #4a4aff;
            --move-dot: #00aa00;
            --capture-dot: #cc0000;
            --safe-top: env(safe-area-inset-top, 0px); 
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            /* 動態大小，會被 JS 的 resizeBoard 以 vmin 為單位自動覆蓋 */
            --board-size: 95vmin; 
        }

        html, body { height: 100%; width: 100%; overflow: hidden; overscroll-behavior: none; }
        
        body { 
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; 
            background: var(--bg-grad); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            color: white; 
            transition: background 0.5s; 
            touch-action: none; 
            box-sizing: border-box; 
            user-select: none;
        }

        /* --- CSS頂部極光進度條 (電腦思考時間倒數) --- */
        #scroll-progress-bar {
            position: fixed; /* 固定在視窗最上方 */
            top: 0;
            left: 0;
            width: 0%; /* 初始寬度為 0% */
            height: 4px; /* 進度條的高度 */
            background: linear-gradient(90deg, #00f260, #0575e6); /* 極光綠到藍的漸層 */
            z-index: 99999; /* 確保它在所有元素的最上層 */
            transition: opacity 0.3s ease-out; /* 透明度變化平滑 */
            box-shadow: 0 0 15px rgba(5, 117, 230, 0.7); /* 外發光效果 */
            pointer-events: none; /* 確保進度條不會干擾滑鼠點擊網頁內容 */
            opacity: 0; /* 預設隱藏，思考時顯示 */
        }

        /* === 頂部 UI 樣式 === */
        header { 
            width: 100%; height: auto; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; gap: 4px; flex-shrink: 0; 
            z-index: 100; padding: calc(var(--safe-top) + 8px) 0 8px 0; 
            background: rgba(0,0,0,0.3); backdrop-filter: blur(8px); 
            border-bottom: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
            transition: all 0.3s ease;
        }

        .header-top { display: flex; align-items: center; justify-content: center; gap: 15px; width: 95%; max-width: 600px; }
        h2 { font-size: 1.1rem; margin: 0; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); white-space: nowrap; font-weight: 700; }
        
        .status-container { display: flex; align-items: center; gap: 12px; }
        .status { color: #f1c40f; font-weight: bold; font-size: 1rem; text-shadow: 0 1px 3px rgba(0,0,0,0.9); line-height: 1.4; }
        .stats { color: #ffcc00; font-size: 0.85rem; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.8); white-space: nowrap; transition: opacity 0.3s;}

        .btn-group { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap;}
        .btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #f0f0f0; padding: 5px 10px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; white-space: nowrap; backdrop-filter: blur(4px); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }
        .btn-red { background: rgba(220, 50, 50, 0.85); border: none; }
        .btn-blue { background: rgba(20, 140, 230, 0.85); border: none; }
        .btn-orange { background: rgba(230, 140, 20, 0.85); border: none; }

        /* === 橫向模式 UI 適配 === */
        body.is-landscape { flex-direction: row; padding-left: var(--safe-left); padding-right: var(--safe-right); justify-content: center; }
        body.is-landscape header { width: 140px; height: 100vh; padding: 0; border-bottom: none; border-right: 1px solid rgba(255,255,255,0.1); justify-content: center; flex-direction: column; gap: 20px; background: rgba(0,0,0,0.4); }
        body.is-landscape .header-top { flex-direction: column; width: 100%; gap: 10px; margin: 0; }
        body.is-landscape h2 { white-space: normal; text-align: center; }
        body.is-landscape .status-container { flex-direction: column; gap: 5px; }
        body.is-landscape .status { font-size: 1rem; text-align: center; }
        body.is-landscape .btn-group { flex-direction: column; width: 100%; gap: 12px; }
        body.is-landscape .btn { width: 85%; text-align: center; padding: 10px 0; }

        /* === 設定面板樣式 === */
        #settings { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2000; background: rgba(30, 30, 30, 0.95); width: 340px; padding: 20px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.1); max-height: 90vh; overflow-y: auto; }
        .set-row { margin-bottom: 12px; }
        .flex-split { display: flex; gap: 10px; justify-content: space-between; }
        .flex-split > div { flex: 1; display: flex; flex-direction: column; }
        label { font-size: 0.85rem; margin-bottom: 5px; color: #aaa; }
        .vol-hint { color: #f1c40f; font-weight: bold; margin-left: 4px; }
        select, input[type=range] { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #555; background: #222; color: #fff; height: 38px; box-sizing: border-box; }

        /* === 遊戲容器與棋盤 === */
        #game-container { flex-shrink: 1; flex-grow: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; width: 100%; box-sizing: border-box; }
        body.is-landscape #game-container { width: auto; height: 100vh; flex-grow: 0; }
        
        .board-wrap { 
            position: relative; 
            width: var(--board-size);
            height: var(--board-size);
            background: var(--board-border); 
            border: 4px solid var(--board-border); 
            border-radius: 6px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.7); 
            box-sizing: border-box; flex-shrink: 0; 
            transition: transform 0.1s ease-out;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            margin: auto;
        }

        .square {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-sizing: border-box;
        }

        .square.light { background: linear-gradient(135deg, #e8e8e8 0%, #dcdcdc 100%); }
        .square.dark { background: linear-gradient(135deg, #7a7a7a 0%, #606060 100%); }

        /* 座標標示 */
        .square.rank-label::before { content: attr(data-rank); position: absolute; top: 2px; left: 2px; font-size: calc(var(--board-size)*0.015 + 6px); color: #fff; text-shadow: 1px 1px 0 #000; z-index: 5; font-weight: bold;}
        .square.file-label::after { content: attr(data-file); position: absolute; bottom: 2px; right: 2px; font-size: calc(var(--board-size)*0.015 + 6px); color: #fff; text-shadow: 1px 1px 0 #000; z-index: 5; font-weight: bold;}

        /* 狀態高亮 */
        .square.selected { border: 3px solid var(--selected-border); background-color: rgba(74, 74, 255, 0.4); }
        
        .square.highlight-move::before, .square.highlight-capture::before {
            content: ''; position: absolute; z-index: 20; border-radius: 50%; pointer-events: none; box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .square.highlight-move::before { width: 30%; height: 30%; background-color: var(--move-dot); border: 2px solid #aaffaa; }
        .square.highlight-capture::before { width: 50%; height: 50%; background-color: transparent; border: 4px solid var(--capture-dot); box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }

        /* 棋子 */
        .piece { width: 85%; height: 85%; z-index: 10; pointer-events: none; filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.8)); transition: transform 0.2s; }

        /* === 勝利特效動畫 === */
        #win-overlay { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            pointer-events: none; opacity: 0; z-index: 1000; font-weight: 900; background: rgba(0,0,0,0.7); backdrop-filter: blur(3px); transition: opacity 0.5s;
        }
        #win-overlay.show { opacity: 1; pointer-events: auto; }

        /* === 規則說明視窗排版優化 === */
        #rules-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; justify-content: center; align-items: center; }
        .rules-content { background: #2b2b2b; width: 90%; max-width: 500px; border-radius: 12px; padding: 25px; color: #ddd; max-height: 80vh; overflow-y: auto;}
        .rules-content h3 { color: #f1c40f; text-align: center; border-bottom: 1px solid #555; padding-bottom: 10px;}
        .close-rules { width: 100%; padding: 10px; background: #cc0000; color: #fff; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer; font-weight: bold;}
        .rules-list-container { padding: 0; list-style: none; margin-top: 15px; }
        .rule-item { display: flex; align-items: flex-start; margin-bottom: 12px; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        .rule-piece { width: 36px; height: 36px; margin-right: 12px; flex-shrink: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.8)); }
        .rule-text { font-size: 0.95rem; line-height: 1.5; color: #ddd; text-align: left; }
        .rule-text b { color: #4dd0e1; font-size: 1.05rem; }
    </style>
</head>
<body>

<div id="scroll-progress-bar"></div>

<header id="main-header">
    <div class="header-top">
        <h2 id="app-title" data-i18n="title">大理石西洋棋 2026</h2>
        <div class="status-container">
            <div class="status" id="status">您 (白方) 的回合</div>
            <div class="stats" id="thinking" style="opacity: 0;">🧠 電腦思考中...</div>
        </div>
    </div>
    <div class="btn-group">
        <button class="btn" onclick="toggleSet()" data-i18n="btnSet">⚙️ 設定</button>
        <button class="btn btn-blue" onclick="switchSides()" data-i18n="btnSwitch">🔄 換方</button>
        <button class="btn btn-orange" onclick="undoMove()" data-i18n="btnUndo">↩️ 悔棋</button> 
        <button class="btn btn-red" onclick="resetGame()" data-i18n="btnReset">🛑 重開</button>
    </div>
</header>

<div id="settings">
    <div class="set-row flex-split">
        <div>
            <label data-i18n="aiDiff">AI 難度 (思考深度)</label>
            <select id="diff-sel" onchange="changeDifficulty()">
                <option value="2" data-i18n="diffEasy">🟩 簡單 (休閒)</option>
                <option value="3" selected data-i18n="diffNormal">🟨 普通 (預設)</option>
                <option value="4" data-i18n="diffHard">🟥 困難 (挑戰)</option>
            </select>
        </div>
        <div>
            <label data-i18n="lang">語言</label>
            <select id="lang-sel" onchange="changeLang()">
                <option value="tw" selected>繁中</option>
                <option value="cn">简中</option>
                <option value="en">English</option>
            </select>
        </div>
    </div>

    <div class="set-row flex-split vol-row">
        <div>
            <label><span data-i18n="bgm">背景音樂</span></label>
            <select id="music-sel" onchange="changeMusic()">
                <option value="none">🔇 靜音</option>
                <option value="01">🎵 樂曲 01</option>
                <option value="02" selected>🎵 樂曲 02</option>
                <option value="03">🎵 樂曲 03</option>
                <option value="04">🎵 樂曲 04</option>
                <option value="05">🎵 樂曲 05</option>
                <option value="06">🎵 樂曲 06</option>
                <option value="07">🎵 樂曲 07</option>
            </select>
        </div>
    </div>

    <div class="set-row flex-split vol-row">
        <div>
            <label><span data-i18n="volBgm">音樂音量</span><span id="bgm-val-hint" class="vol-hint">20</span></label>
            <input type="range" id="bgm-vol" min="0" max="100" value="20" oninput="adjBgm()">
        </div>
        <div>
            <label><span data-i18n="volSfx">音效音量</span><span id="sfx-val-hint" class="vol-hint">50</span></label>
            <input type="range" id="sfx-vol" min="0" max="100" value="50" oninput="adjSfx()">
        </div>
    </div>
    
    <div class="set-row flex-split" style="align-items: center; margin-top: 15px; margin-bottom: 15px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #aaa; width: 50%;">
            <input type="checkbox" id="show-hint-chk" checked onchange="toggleHint()" style="width: 18px; height: 18px; margin: 0; cursor: pointer;">
            <span data-i18n="moveHint">移動提示</span>
        </label>
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #aaa; width: 50%;">
            <input type="checkbox" id="show-progress-chk" checked onchange="toggleProgress()" style="width: 18px; height: 18px; margin: 0; cursor: pointer;">
            <span data-i18n="aiProgress">電腦思考進度</span>
        </label>
    </div>
    
    <div class="set-row flex-split">
        <button class="btn" onclick="toggleRules()" style="flex:1; background:#2c3e50; padding: 10px;" data-i18n="btnRules">📖 遊戲規則</button>
        <button class="btn" onclick="goHome()" style="flex:1; background:#c0392b; padding: 10px;" data-i18n="btnHome">🏠 回首頁</button>
    </div>

    <button class="btn" style="width:100%; background:#444; padding: 10px; margin-top:10px;" onclick="toggleSet()" data-i18n="btnDone">完成設定</button>
    <div style="text-align:center; font-size:10px; color:#aaa; margin-top:15px; letter-spacing: 0.5px;">© 2026 Johsok. All rights reserved.</div>
</div>

<div id="rules-modal">
    <div class="rules-content">
        <h3 id="rules-title" data-i18n="rulesTitle">西洋棋詳細規則</h3>
        <div id="rules-list" class="rules-list-container"></div>
        <button class="close-rules" onclick="toggleRules()" data-i18n="btnCloseRules">關閉說明</button>
    </div>
</div>

<div id="game-container">
    <div class="board-wrap" id="board"></div>
    <div id="win-overlay"></div>
</div>

<audio id="bgm" loop></audio>

    document.getElementById('rules-list').innerHTML = langDict[currentLang].rulesList;

        if (langDict[currentLang][key]) el.innerText = langDict[currentLang][key];
    });
    updateStatus();
    
    // 如果正在思考，也更新對應文字
    if (thinkingEl.style.opacity === '1') {
        if (aiCountdownFinished) thinkingEl.innerText = langDict[currentLang].moving;
        else thinkingEl.innerText = `${langDict[currentLang].thinking} ${aiSecondsLeft}s`;
    }
}

document.addEventListener('contextmenu', e => e.preventDefault());
document.onkeydown = function(e) {
    if (e.keyCode == 123) return false;
    if (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 67 || e.keyCode == 74)) return false;
    if (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83)) return false;
};

function checkOrientation() { 
    const isLand = window.innerWidth > window.innerHeight && window.innerHeight < 650; 
    isLand ? document.body.classList.add('is-landscape') : document.body.classList.remove('is-landscape'); 
    return isLand; 
}

// 動態計算棋盤大小，使其在可用範圍內最大化 (精準轉換為 vmin 單位)
function resizeBoard() { 
    const isLand = checkOrientation();
    const header = document.getElementById('main-header');
    const winW = window.innerWidth, winH = window.innerHeight; 
    let finalSizePx;
    
    if (isLand) {
        // 橫式：扣除左側選單與安全邊距
        const headerW = 140, gap = winW * 0.02;
        finalSizePx = Math.min(winW - headerW - gap - 20, winH - 20);
    } else {
        // 直式：扣除頂部標題列與安全邊距
        finalSizePx = Math.min(winW - 20, winH - header.offsetHeight - 20);
    }
    
    // 計算出目前的 1 vmin 相當於多少像素
    let currentVminPx = Math.min(winW, winH) / 100;
    
    // 將計算出的像素大小轉換為 vmin，並賦予給 CSS 變數
    let sizeInVmin = finalSizePx / currentVminPx;
    document.documentElement.style.setProperty('--board-size', `${sizeInVmin}vmin`);
    
    applyZoom();
}
window.addEventListener('resize', () => { setTimeout(resizeBoard, 100); });

/* === 音效系統 === */
let userInteracted = false;
const audio = document.getElementById('bgm'), audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function getMp3Path(val) {
    if (val === 'none') return "";
    return `https://johsok.github.io/Games/MP3/${val}.mp3`;
}

function unlockAudio() {
    userInteracted = true;
    if(audioCtx.state === 'suspended') audioCtx.resume();
    audio.volume = document.getElementById('bgm-vol').value/100;
    if (!audio.src || audio.src === "") {
        const val = document.getElementById('music-sel').value;
        if(val !== 'none') audio.src = getMp3Path(val);
    }
    if(document.getElementById('music-sel').value !== 'none') audio.play().catch(() => {});
}

document.addEventListener("visibilitychange", () => {
    if (document.hidden) { audio.pause(); } 
    else if (userInteracted && document.getElementById('music-sel').value !== 'none') { audio.play().catch(() => {}); }
});
document.addEventListener('click', unlockAudio, {once:true, capture:true}); 
document.addEventListener('touchstart', unlockAudio, {once:true, capture:true});

function playSfx(freq, type) { 
    if(audioCtx.state === 'suspended') audioCtx.resume(); 
    const v = document.getElementById('sfx-vol').value/100; if(v <= 0.01) return; 
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain(); 
    osc.connect(g); g.connect(audioCtx.destination); 
    if(type === 'win') {
        osc.type = "square"; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        g.gain.setValueAtTime(v, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
        osc.start(); osc.stop(audioCtx.currentTime+1);
    } else if (type === 'move') {
        osc.type = "sine"; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        g.gain.setValueAtTime(v, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime+0.1);
    } else if (type === 'capture') {
        osc.type = "triangle"; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        g.gain.setValueAtTime(v, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime+0.2);
    }
}

let showAIProgress = true;

/* === 縮放與平移系統 (完美移植，支援 RWD) === */
let currentZoom = 1.0; 
let isPanning = false;
let lastPanX = 0, lastPanY = 0;
let panX = 0, panY = 0; 
let hasMoved = false; 
let initialPinchDistance = null;
let startZoom = 1.0;
const gameContainerEl = document.getElementById('game-container');
const boardWrap = document.getElementById('board');

function applyZoom() {
    if (currentZoom === 1.0) { panX = 0; panY = 0; }
    // 使用 transform 來進行畫面的平移與縮放，這不會影響 CSS 的 vmin 排版基準
    boardWrap.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${currentZoom})`;
}

gameContainerEl.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
        isPanning = false; e.preventDefault(); 
        initialPinchDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        startZoom = currentZoom; 
    } else if (e.touches.length === 1) {
        isPanning = true; hasMoved = false;
        lastPanX = e.touches[0].clientX; lastPanY = e.touches[0].clientY;
    }
}, { passive: false });

gameContainerEl.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && initialPinchDistance) {
        hasMoved = true; e.preventDefault(); 
        let scale = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY) / initialPinchDistance;
        currentZoom = startZoom * scale;
        if (currentZoom < 1.0) currentZoom = 1.0; if (currentZoom > 3.0) currentZoom = 3.0;
        applyZoom(); 
    } else if (e.touches.length === 1 && isPanning) {
        let moveX = e.touches[0].clientX - lastPanX; let moveY = e.touches[0].clientY - lastPanY;
        if (Math.abs(moveX) > 3 || Math.abs(moveY) > 3) {
            hasMoved = true; e.preventDefault(); 
            panX += moveX; panY += moveY;
            applyZoom();
            lastPanX = e.touches[0].clientX; lastPanY = e.touches[0].clientY;
        }
    }
}, { passive: false });

gameContainerEl.addEventListener('touchend', (e) => {
    if (!hasMoved && e.changedTouches.length === 1) {
        let target = e.target;
        if (target && target.closest('.square')) {
            e.preventDefault(); 
            target.closest('.square').click();
        }
    }
    if (e.touches.length < 2) initialPinchDistance = null;
    if (e.touches.length === 0) isPanning = false;
});


/* === 西洋棋核心與 UI 渲染 === */
const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const thinkingEl = document.getElementById('thinking');
const winOverlay = document.getElementById('win-overlay');
const game = new Chess();

let selectedSquare = null;
let playerColor = 'w';
let aiDepth = 3; 

function changeDifficulty() {
    aiDepth = parseInt(document.getElementById('diff-sel').value);
    resetGame();
}

function createBoard() {
    boardEl.innerHTML = '';
    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    const rStart = playerColor === 'w' ? 8 : 1, rEnd = playerColor === 'w' ? 1 : 8, rStep = playerColor === 'w' ? -1 : 1;
    const cStart = playerColor === 'w' ? 0 : 7, cEnd = playerColor === 'w' ? 7 : 0, cStep = playerColor === 'w' ? 1 : -1;

    for (let r = rStart; playerColor === 'w' ? r >= rEnd : r <= rEnd; r += rStep) {
        for (let c = cStart; playerColor === 'w' ? c <= cEnd : c >= cEnd; c += cStep) {
            const squareId = files[c] + r;
            const squareEl = document.createElement('div');
            const isLight = (r + c) % 2 !== 0;
            
            squareEl.className = `square ${isLight ? 'light' : 'dark'}`;
            squareEl.dataset.square = squareId;
            
            if (c === (playerColor === 'w' ? 0 : 7)) squareEl.classList.add('rank-label');
            if (r === (playerColor === 'w' ? 1 : 8)) squareEl.classList.add('file-label');
            squareEl.dataset.rank = r; squareEl.dataset.file = files[c];

            squareEl.addEventListener('click', () => handleSquareClick(squareId));
            boardEl.appendChild(squareEl);
        }
    }
    updateBoard();
}

function updateBoard() {
    document.querySelectorAll('.square').forEach(sq => {
        sq.innerHTML = ''; sq.classList.remove('selected', 'highlight-move', 'highlight-capture');
    });

    const boardData = game.board(), files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const piece = boardData[r][c];
            if (piece) {
                const squareId = files[c] + (8 - r);
                const squareEl = document.querySelector(`[data-square="${squareId}"]`);
                if(squareEl) {
                    const imgEl = document.createElement('img');
                    imgEl.src = pieceImages[piece.color + piece.type];
                    imgEl.className = 'piece';
                    squareEl.appendChild(imgEl);
                }
            }
        }
    }

    if (selectedSquare) {
        document.querySelector(`[data-square="${selectedSquare}"]`).classList.add('selected');
        // 若移動提示勾選開啟，才繪製綠紅點
        if (showMoveHints) {
            game.moves({ square: selectedSquare, verbose: true }).forEach(move => {
                const targetSq = document.querySelector(`[data-square="${move.to}"]`);
                if (move.flags.includes('c') || move.flags.includes('e')) targetSq.classList.add('highlight-capture');
                else targetSq.classList.add('highlight-move');
            });
        }
    }
    updateStatus();
}

function handleSquareClick(squareId) {
    if (game.game_over() || game.turn() !== playerColor) return; 

    const piece = game.get(squareId);
    if (!selectedSquare) {
        if (piece && piece.color === playerColor) { selectedSquare = squareId; updateBoard(); }
        return;
    }

    const moves = game.moves({ square: selectedSquare, verbose: true });
    const move = moves.find(m => m.to === squareId);

    if (move) {
        let isCapture = move.flags.includes('c') || move.flags.includes('e');
        game.move({ from: selectedSquare, to: squareId, promotion: 'q' });
        selectedSquare = null;
        playSfx(0, isCapture ? 'capture' : 'move');
        updateBoard();
        
        if (!game.game_over()) {
            startAISequence(); 
        }
    } else {
        selectedSquare = (piece && piece.color === playerColor) ? squareId : null;
        updateBoard();
    }
}

function updateStatus() {
    let isPlayerTurn = game.turn() === playerColor;
    if (game.in_checkmate()) {
        let msg = isPlayerTurn ? langDict[currentLang].mateB : langDict[currentLang].mateW;
        statusEl.innerHTML = msg;
        showWin(isPlayerTurn ? 'YOU LOSE' : 'YOU WIN', isPlayerTurn ? '#e74c3c' : '#0ff');
    } else if (game.in_draw()) {
        statusEl.innerHTML = langDict[currentLang].draw;
        showWin('DRAW', '#f1c40f');
    } else {
        statusEl.innerHTML = isPlayerTurn ? langDict[currentLang].turnW : langDict[currentLang].turnB;
        if (game.in_check()) statusEl.innerHTML += ` <span style="color:#ff4444;">${langDict[currentLang].check}</span>`;
    }
}

function showWin(msg, color) {
    playSfx(800, 'win');
    winOverlay.innerHTML = `<div style="font-size: calc(var(--board-size) * 0.16); color: ${color}; text-shadow: 0 0 10px ${color}, 0 0 20px #000, 2px 2px 5px #000;">${msg}</div>`;
    winOverlay.classList.add('show');
}

// === 狀態取消助手函數 (中斷電腦思考) ===
function cancelAI() {
    if (aiCountdownInterval) {
        clearInterval(aiCountdownInterval);
        aiCountdownInterval = null;
    }
    if (aiProgressAnim) {
        cancelAnimationFrame(aiProgressAnim);
        aiProgressAnim = null;
    }
    const bar = document.getElementById('scroll-progress-bar');
    bar.style.opacity = '0';
    bar.style.width = '0%';
    thinkingEl.style.opacity = '0';
    aiBestMove = null;
}

// === 換方與悔棋邏輯 ===
function switchSides() {
    cancelAI(); // 停止電腦思考
    playerColor = playerColor === 'w' ? 'b' : 'w'; // 切換視角
    
    createBoard(); // 重新渲染翻轉後的棋盤
    updateStatus();

    // 如果切換後輪到對手 (AI)，則觸發 AI 下棋
    if (game.turn() !== playerColor && !game.game_over()) {
        startAISequence();
    }
}

function undoMove() {
    cancelAI(); // 停止電腦思考
    const history = game.history();
    if (history.length === 0) return; // 無棋可悔
    
    if (game.turn() !== playerColor) {
        // 電腦正在思考 (剛輪到電腦)，玩家想悔棋 -> 撤銷 1 步 (玩家剛下的那步)
        game.undo();
    } else {
        // 輪到玩家下棋，玩家想悔棋 -> 撤銷 2 步 (電腦的一步 + 玩家的一步)
        if (history.length >= 2) {
            game.undo();
            game.undo();
        } else {
            game.undo(); // 只有1步時 (例如玩家自己對弈或剛換方)
        }
    }
    
    selectedSquare = null;
    winOverlay.classList.remove('show');
    createBoard(); // 重新繪製棋盤以確保狀態正確
    updateStatus();
}

function resetGame() {
    cancelAI();
    game.reset();
    selectedSquare = null;
    winOverlay.classList.remove('show');
    if (playerColor === 'b') {
        createBoard(); 
        startAISequence(); 
    } else {
        createBoard();
    }
}

/* ==========================================
 * 最強電腦 AI 引擎 (Stockfish.js Web Worker 整合)
 * ========================================== */

let engine = null;
let aiBestMove = null;
let aiCountdownFinished = false;
let aiCountdownInterval = null;
let aiSecondsLeft = 3;
let aiProgressAnim = null;

// 使用 Blob 技術載入 Stockfish，完美避開 Web Worker 跨網域 (CORS) 的限制
fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js')
    .then(response => response.text())
    .then(text => {
        const blob = new Blob([text], { type: 'application/javascript' });
        engine = new Worker(URL.createObjectURL(blob));
        
        // 監聽 Stockfish 引擎回傳的訊息
        engine.onmessage = function(event) {
            const line = event.data;
            if (line && line.startsWith('bestmove')) {
                const match = line.match(/^bestmove\s+([a-h][1-8][a-h][1-8][qrbn]?)/);
                if (match) {
                    aiBestMove = match[1];
                    checkAndExecuteMove();
                }
            }
        };
        engine.postMessage('uci');
    })
    .catch(err => console.error('無法載入 Stockfish 引擎', err));

function getStockfishLevel() {
    if (aiDepth == 2) return { skill: 0, depth: 5, time: 1000 };
    if (aiDepth == 3) return { skill: 10, depth: 10, time: 2000 };
    if (aiDepth == 4) return { skill: 20, depth: 15, time: 2800 };
    return { skill: 10, depth: 10, time: 2000 };
}

// === 電腦思考與動畫進度系統 ===
function updateAIProgressAnimation(startTime, totalDuration) {
    const elapsed = performance.now() - startTime;
    let p = Math.min((elapsed / totalDuration) * 100, 100);
    
    // 如果玩家開啟進度條，才顯示並變更寬度
    if (showAIProgress) {
        document.getElementById('scroll-progress-bar').style.width = p + '%';
    }

    if (elapsed < totalDuration && !aiCountdownFinished && thinkingEl.style.opacity === '1') {
        aiProgressAnim = requestAnimationFrame(() => updateAIProgressAnimation(startTime, totalDuration));
    }
}

function startAISequence() {
    thinkingEl.style.opacity = '1';
    aiSecondsLeft = 3; 
    aiBestMove = null;
    aiCountdownFinished = false;
    
    thinkingEl.innerText = `${langDict[currentLang].thinking} ${aiSecondsLeft}s`;
    
    // 啟動頂部極光進度條特效
    if (aiProgressAnim) cancelAnimationFrame(aiProgressAnim);
    const bar = document.getElementById('scroll-progress-bar');
    bar.style.width = '0%';
    if (showAIProgress) bar.style.opacity = '1';
    aiProgressAnim = requestAnimationFrame(() => updateAIProgressAnimation(performance.now(), 3000));
    
    // 啟動數字倒數 3 秒
    if (aiCountdownInterval) clearInterval(aiCountdownInterval);
    aiCountdownInterval = setInterval(() => {
        aiSecondsLeft--;
        if (aiSecondsLeft > 0) {
            thinkingEl.innerText = `${langDict[currentLang].thinking} ${aiSecondsLeft}s`;
        } else {
            clearInterval(aiCountdownInterval);
            thinkingEl.innerText = langDict[currentLang].moving;
            aiCountdownFinished = true;
            checkAndExecuteMove();
        }
    }, 1000);

    // 命令 Stockfish 思考
    if (engine) {
        const config = getStockfishLevel();
        engine.postMessage(`setoption name Skill Level value ${config.skill}`);
        engine.postMessage(`position fen ${game.fen()}`);
        engine.postMessage(`go depth ${config.depth} movetime ${config.time}`);
    } else {
        const possibleMoves = game.moves({verbose: true});
        if(possibleMoves.length > 0) {
            aiBestMove = possibleMoves[0].from + possibleMoves[0].to;
            if (possibleMoves[0].promotion) aiBestMove += possibleMoves[0].promotion;
        }
    }
}

function checkAndExecuteMove() {
    if (aiCountdownFinished && aiBestMove) {
        thinkingEl.style.opacity = '0';
        
        // 隱藏並重置極光進度條
        const bar = document.getElementById('scroll-progress-bar');
        bar.style.opacity = '0';
        setTimeout(() => { bar.style.width = '0%'; }, 300);
        
        const moveObj = {
            from: aiBestMove.substring(0, 2),
            to: aiBestMove.substring(2, 4),
            promotion: aiBestMove.length === 5 ? aiBestMove[4] : undefined
        };

        const moveRes = game.move(moveObj);
        if (moveRes) {
            let isCapture = moveRes.flags.includes('c') || moveRes.flags.includes('e');
            playSfx(0, isCapture ? 'capture' : 'move');
        }
        updateBoard();
    }
}

// 系統初始化
window.onload = () => { changeLang(); resizeBoard(); createBoard(); };
