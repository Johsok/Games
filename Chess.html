<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D 大理石西洋棋與電腦對戰</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            /* 模擬圖片中的大理石冷灰色調 */
            --dark-square: #6b6b6b;
            --light-square: #dcdcdc;
            --board-border: #333;
            --selected-border: #4a4aff; /* 選取的藍框 */
            --move-dot: #00aa00; /* 可移動的綠點 */
            --capture-dot: #cc0000; /* 可吃子的紅點 */
        }

        body {
            background-color: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .status-panel {
            display: flex;
            justify-content: space-between;
            width: 480px;
            margin-bottom: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* 棋盤主體 */
        .board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 4px solid var(--board-border);
            background-color: var(--board-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .square {
            width: 60px;
            height: 60px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-sizing: border-box;
        }

        /* 模擬石材紋理 */
        .square.light {
            background: linear-gradient(135deg, #e8e8e8 0%, #dcdcdc 100%);
        }
        .square.dark {
            background: linear-gradient(135deg, #7a7a7a 0%, #606060 100%);
        }

        /* 座標標示 (a-h, 1-8) */
        .square.rank-label::before {
            content: attr(data-rank);
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 10px;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            z-index: 5;
        }
        .square.file-label::after {
            content: attr(data-file);
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 10px;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            z-index: 5;
        }

        /* 狀態高亮 */
        .square.selected {
            border: 3px solid var(--selected-border);
            background-color: rgba(74, 74, 255, 0.2);
        }
        
        /* 綠點 (合法移動) 與 紅點 (可吃子) */
        .square.highlight-move::before,
        .square.highlight-capture::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            z-index: 20;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        
        .square.highlight-move::before {
            background-color: var(--move-dot);
            border: 2px solid #aaffaa;
        }

        .square.highlight-capture::before {
            background-color: var(--capture-dot);
            border: 2px solid #ffaaaa;
            width: 24px;
            height: 24px;
        }

        /* 棋子圖示 */
        .piece {
            width: 50px;
            height: 50px;
            z-index: 10;
            pointer-events: none; /* 點擊穿透到 square */
            /* 圖片中的棋子有明顯的描邊感，用 drop-shadow 模擬 */
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.8));
            transition: transform 0.2s;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 8px 16px;
            font-size: 1rem;
            cursor: pointer;
            background-color: #444;
            color: white;
            border: 1px solid #777;
            border-radius: 4px;
        }
        button:hover { background-color: #555; }
        
        #thinking {
            color: #ffcc00;
            font-size: 0.9rem;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="status-panel">
            <div id="status">您 (白方) 的回合</div>
            <div id="thinking">電腦思考中...</div>
        </div>

        <div class="board" id="board"></div>

        <div class="controls">
            <button onclick="resetGame()">重新開始</button>
            <button onclick="switchSides()">玩家換黑方</button>
        </div>
    </div>

        function createBoard() {
            boardEl.innerHTML = '';
            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            
            // 根據玩家顏色決定渲染順序，若玩家為黑方則翻轉棋盤
            const rStart = playerColor === 'w' ? 8 : 1;
            const rEnd = playerColor === 'w' ? 1 : 8;
            const rStep = playerColor === 'w' ? -1 : 1;
            
            const cStart = playerColor === 'w' ? 0 : 7;
            const cEnd = playerColor === 'w' ? 7 : 0;
            const cStep = playerColor === 'w' ? 1 : -1;

            for (let r = rStart; playerColor === 'w' ? r >= rEnd : r <= rEnd; r += rStep) {
                for (let c = cStart; playerColor === 'w' ? c <= cEnd : c >= cEnd; c += cStep) {
                    const squareId = files[c] + r;
                    const squareEl = document.createElement('div');
                    
                    const isLight = (r + c) % 2 !== 0;
                    squareEl.className = `square ${isLight ? 'light' : 'dark'}`;
                    squareEl.dataset.square = squareId;
                    
                    // 加入邊緣座標
                    if (c === (playerColor === 'w' ? 0 : 7)) squareEl.classList.add('rank-label');
                    if (r === (playerColor === 'w' ? 1 : 8)) squareEl.classList.add('file-label');
                    
                    squareEl.dataset.rank = r;
                    squareEl.dataset.file = files[c];

                    squareEl.addEventListener('click', () => handleSquareClick(squareId));
                    boardEl.appendChild(squareEl);
                }
            }
            updateBoard();
        }

        function updateBoard() {
            document.querySelectorAll('.square').forEach(sq => {
                sq.innerHTML = '';
                sq.classList.remove('selected', 'highlight-move', 'highlight-capture');
            });

            const boardData = game.board();
            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = boardData[r][c];
                    if (piece) {
                        const squareId = files[c] + (8 - r);
                        const squareEl = document.querySelector(`[data-square="${squareId}"]`);
                        if(squareEl) {
                            const imgEl = document.createElement('img');
                            imgEl.src = pieceImages[piece.color + piece.type];
                            imgEl.className = 'piece';
                            squareEl.appendChild(imgEl);
                        }
                    }
                }
            }

            if (selectedSquare) {
                document.querySelector(`[data-square="${selectedSquare}"]`).classList.add('selected');
                const moves = game.moves({ square: selectedSquare, verbose: true });
                moves.forEach(move => {
                    const targetSq = document.querySelector(`[data-square="${move.to}"]`);
                    // 判斷該步是吃子還是移動
                    if (move.flags.includes('c') || move.flags.includes('e')) {
                        targetSq.classList.add('highlight-capture');
                    } else {
                        targetSq.classList.add('highlight-move');
                    }
                });
            }

            updateStatus();
        }

        function handleSquareClick(squareId) {
            if (game.game_over() || game.turn() !== playerColor) return; // 電腦回合禁止點擊

            const piece = game.get(squareId);

            if (!selectedSquare) {
                if (piece && piece.color === playerColor) {
                    selectedSquare = squareId;
                    updateBoard();
                }
                return;
            }

            const moves = game.moves({ square: selectedSquare, verbose: true });
            const move = moves.find(m => m.to === squareId);

            if (move) {
                game.move({ from: selectedSquare, to: squareId, promotion: 'q' }); // 預設升變為后
                selectedSquare = null;
                updateBoard();
                
                // 玩家下完後，換電腦下
                if (!game.game_over()) {
                    thinkingEl.style.visibility = 'visible';
                    setTimeout(makeAIMove, 50); // 延遲讓畫面先更新
                }
            } else {
                if (piece && piece.color === playerColor) {
                    selectedSquare = squareId;
                } else {
                    selectedSquare = null;
                }
                updateBoard();
            }
        }

        function updateStatus() {
            let statusHTML = '';
            let isPlayerTurn = game.turn() === playerColor;

            if (game.in_checkmate()) {
                statusHTML = `遊戲結束！${isPlayerTurn ? '您被將死了' : '您贏了！'}`;
            } else if (game.in_draw()) {
                statusHTML = '遊戲和局。';
            } else {
                statusHTML = isPlayerTurn ? '您的回合' : '電腦的回合';
                if (game.in_check()) {
                    statusHTML += ' <span style="color:#ff4444;">(將軍!)</span>';
                }
            }
            statusEl.innerHTML = statusHTML;
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            thinkingEl.style.visibility = 'hidden';
            if (playerColor === 'b') {
                createBoard(); // 重新繪製棋盤
                thinkingEl.style.visibility = 'visible';
                setTimeout(makeAIMove, 500); // 電腦先手
            } else {
                updateBoard();
            }
        }

        function switchSides() {
            playerColor = playerColor === 'w' ? 'b' : 'w';
            document.querySelector('.controls button:nth-child(2)').innerText = 
                playerColor === 'w' ? '玩家換黑方' : '玩家換白方';
            resetGame();
        }

        // ==========================================
        // 電腦 AI 邏輯 (Minimax 演算法搭配 Alpha-Beta 剪枝)
        // ==========================================
        const pieceValues = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };

        function evaluateBoard(gameObj) {
            let totalEvaluation = 0;
            const board = gameObj.board();
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const piece = board[i][j];
                    if (piece) {
                        const val = pieceValues[piece.type];
                        // 站在 AI 的視角評估：AI 顏色加分，玩家顏色扣分
                        totalEvaluation += (piece.color === game.turn() ? val : -val); 
                    }
                }
            }
            return totalEvaluation;
        }

        function minimax(gameObj, depth, alpha, beta, isMaximizingPlayer) {
            if (depth === 0 || gameObj.game_over()) {
                return evaluateBoard(gameObj);
            }

            const moves = gameObj.moves();

            if (isMaximizingPlayer) {
                let bestVal = -Infinity;
                for (let i = 0; i < moves.length; i++) {
                    gameObj.move(moves[i]);
                    bestVal = Math.max(bestVal, minimax(gameObj, depth - 1, alpha, beta, !isMaximizingPlayer));
                    gameObj.undo();
                    alpha = Math.max(alpha, bestVal);
                    if (beta <= alpha) break;
                }
                return bestVal;
            } else {
                let bestVal = Infinity;
                for (let i = 0; i < moves.length; i++) {
                    gameObj.move(moves[i]);
                    bestVal = Math.min(bestVal, minimax(gameObj, depth - 1, alpha, beta, !isMaximizingPlayer));
                    gameObj.undo();
                    beta = Math.min(beta, bestVal);
                    if (beta <= alpha) break;
                }
                return bestVal;
            }
        }

        function makeAIMove() {
            const possibleMoves = game.moves();
            if (possibleMoves.length === 0) return;

            let bestMove = null;
            let bestValue = -Infinity;

            // 為了避免每次都走一樣的步，稍微打亂移動順序
            possibleMoves.sort(() => Math.random() - 0.5);

            for (let i = 0; i < possibleMoves.length; i++) {
                const move = possibleMoves[i];
                game.move(move);
                // 電腦視角為 Maximizing
                const boardValue = minimax(game, aiDepth - 1, -Infinity, Infinity, false);
                game.undo();
                
                if (boardValue > bestValue) {
                    bestValue = boardValue;
                    bestMove = move;
                }
            }

            if (!bestMove) bestMove = possibleMoves[0]; // 防呆
            
            game.move(bestMove);
            thinkingEl.style.visibility = 'hidden';
            updateBoard();
        }

        // 初始化
        createBoard();

    </script>
